<script>
    // URL Web App จาก Google Apps Script ของคุณ
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx51fB_rn_XjG__EI40j9UFRPPFU-Oqd5XY9TvtOqoI13Axkl1WOYJfc8aqucHVz6L-wiQ/exec";
    let myUID = "";

    async function submitData() {
        myUID = document.getElementById('uid').value.trim();
        const name = document.getElementById('name').value.trim();
        const amount = document.getElementById('amount').value;
        const days = document.getElementById('days').value;

        if(!myUID || !name || !amount) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "กำลังส่งข้อมูล...";

        try {
            // ใช้ mode: 'no-cors' เพื่อทะลุติดปัญหาการรับส่งต่างโดเมน
            await fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain"
                },
                body: JSON.stringify({ 
                    action: "register", 
                    uid: myUID, 
                    name: name, 
                    amount: Number(amount), 
                    days: Number(days) 
                })
            });

            // เด้ง Pop-up สำเร็จทันที
            document.getElementById('popup').style.display = 'flex';
        } catch (err) {
            alert("เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้ง");
            btn.disabled = false;
            btn.innerText = "ส่งข้อมูลสมัคร";
        }
    }

    function closePopup() {
        document.getElementById('popup').style.display = 'none';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('statusSection').style.display = 'block';
        document.getElementById('userUidDisplay').innerText = myUID;

        checkStatus();
        setInterval(checkStatus, 20000); // เช็กสถานะทุก 20 วินาที
    }

    async function checkStatus() {
        try {
            const res = await fetch(GAS_URL);
            const data = await res.json();
            const myData = data.find(item => item.uid.toString() === myUID.toString());
            
            const box = document.getElementById('statusBox');
            if(myData) {
                if(myData.status === 'approved') {
                    box.className = "status-box approved";
                    box.innerHTML = `อนุมัติแล้ว!<br>วงเงิน: ${Number(myData.amount).toLocaleString()} บาท<br>ระยะเวลา: ${myData.days} วัน`;
                } else if(myData.status === 'rejected') {
                    box.className = "status-box rejected";
                    box.innerText = "คำขอของคุณไม่ได้รับการอนุมัติ";
                } else {
                    box.className = "status-box pending";
                    box.innerText = "⏳ กำลังรอเจ้าหน้าที่พิจารณา...";
                }
            }
        } catch (err) {
            console.error("Fetch status error:", err);
        }
    }
</script>
