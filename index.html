<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>บริการสินเชื่อเงินด่วน พะเยา</title>
    <style>
        :root { --primary: #dc2626; --green: #059669; --border: #e2e8f0; }
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #f1f5f9; padding: 20px; }
        
        .sidebar { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .calc-header { background: #e2e8f0; padding: 10px; cursor: pointer; display: flex; justify-content: space-between; border-radius: 8px; }
        .calc-body { display: none; padding-top: 10px; }
        .calc-body.show { display: block; }
        
        .btn-pay { background: var(--green); color: white; padding: 12px; border: none; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 320px; }
        
        .btn-save { background: #2563eb; color: white; padding: 10px; border: none; border-radius: 8px; width: 100%; text-decoration: none; display: block; text-align: center; font-weight: bold; }
        .slip-box { margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px; }
        input[type="file"] { width: 100%; padding: 8px; border: 1px dashed var(--border); margin-bottom: 10px; }
    </style>
</head>
<body>

<!-- Sidebar ด้านซ้าย (ตารางคำนวณอยู่ล่างสุด) -->
<div class="sidebar">
    <h3>เมนูหลัก</h3>
    <!-- ตารางคำนวณแบบพับเก็บได้ -->
    <div class="calc-accordion">
        <div class="calc-header" onclick="toggleCalc()">
            <span>🧮 ตารางคำนวณ</span>
            <span id="arrow">▼</span>
        </div>
        <div class="calc-body" id="calcBody">
            <p>วงเงิน: 5,000 บาท</p>
            <p>ดอกเบี้ย: 20%</p>
        </div>
    </div>
</div>

<!-- หน้าชำระเงิน -->
<div class="sidebar">
    <h3>ชำระเงิน</h3>
    <button class="btn-pay" onclick="openModal()">⚡ สร้าง QR Code & แนบสลิป</button>
</div>

<!-- Modal -->
<div class="modal" id="qrModal">
    <div class="modal-content">
        <img id="qrImg" style="width: 100%; margin-bottom: 10px;">
        <a id="saveBtn" class="btn-save">📥 บันทึกรูป QR Code</a>
        
        <form id="slipForm" class="slip-box">
            <input type="file" id="slipFile" accept="image/*" required>
            <button type="submit" class="btn-pay">🚀 ส่งสลิป</button>
        </form>
    </div>
</div>

<script>
    function toggleCalc() {
        const body = document.getElementById('calcBody');
        const arrow = document.getElementById('arrow');
        body.classList.toggle('show');
        arrow.innerText = body.classList.contains('show') ? '▲' : '▼';
    }

    function openModal() {
        const qrUrl = "https://promptpay.io/0658351446/400.png";
        document.getElementById('qrImg').src = qrUrl;
        document.getElementById('saveBtn').href = qrUrl;
        document.getElementById('qrModal').classList.add('show');
    }

    document.getElementById('slipForm').onsubmit = async (e) => {
        e.preventDefault();
        alert('ส่งสลิปเรียบร้อย!');
        document.getElementById('qrModal').classList.remove('show');
    };
</script>
</body>
</html>
