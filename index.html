<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บริการสินเชื่อเงินด่วน พะเยา</title>
    <!-- ลิงก์ไปยังไฟล์ manifest เพื่อให้ขึ้นปุ่ม Install -->
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #dc2626; --green: #059669; --border: #e2e8f0; }
        body { font-family: 'Prompt', sans-serif; background: #f1f5f9; padding: 20px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 320px; }
        .btn-pay { background: var(--green); color: white; padding: 15px; border: none; border-radius: 10px; width: 100%; cursor: pointer; }
        .btn-save { background: #2563eb; color: white; padding: 10px; border: none; border-radius: 8px; width: 100%; text-decoration: none; display: block; text-align: center; }
        .slip-box { margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px; }
        input[type="file"] { width: 100%; padding: 5px; border: 1px dashed var(--border); margin-bottom: 10px; }
    </style>
</head>
<body>

<!-- ปุ่มชำระเงิน -->
<button class="btn-pay" onclick="openModal()">⚡ สร้าง QR & แนบสลิป</button>

<!-- Modal -->
<div class="modal" id="qrModal">
    <div class="modal-content">
        <img id="qrImg" style="width: 100%; margin-bottom: 10px;">
        <a id="saveBtn" class="btn-save">📥 บันทึกรูป QR Code</a>
        
        <form id="slipForm" class="slip-box">
            <input type="file" id="slipFile" accept="image/*" required>
            <button type="submit" class="btn-pay" style="padding: 10px; font-size: 0.8rem;">🚀 ส่งสลิปเข้า Discord</button>
        </form>
    </div>
</div>

<script>
    function openModal() {
        const qrUrl = "https://promptpay.io/0658351446/400.png";
        document.getElementById('qrImg').src = qrUrl;
        document.getElementById('saveBtn').href = qrUrl;
        document.getElementById('qrModal').classList.add('show');
    }

    document.getElementById('slipForm').onsubmit = async (e) => {
        e.preventDefault();
        const file = document.getElementById('slipFile').files[0];
        const formData = new FormData();
        formData.append('content', '💳 มีคนส่งสลิปชำระเงินเข้ามาครับ');
        formData.append('file', file);
        
        await fetch("https://discordapp.com/api/webhooks/1475367009700282379/3LerCdbu5Kc1TuCl19NWjozyVCFy8rcQdIJKrVN5LkebFotPTZo8LX4eBvDEdZgwx0g0", {
            method: 'POST', body: formData
        });
        alert('ส่งสลิปเรียบร้อย!');
        document.getElementById('qrModal').classList.remove('show');
    };
</script>
</body>
</html>
