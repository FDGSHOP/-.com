<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หน้าตรวจสอบสถานะสินเชื่อ (ลูกค้า)</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        .status { margin-top: 20px; padding: 15px; border-radius: 8px; font-weight: bold; }
        .pending { background: #fffbebf1; color: #b45309; }
        .approved { background: #dcfce7; color: #15803d; }
        .rejected { background: #fee2e2; color: #b91c1c; }
        .time-counter { font-size: 12px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h2>สถานะการสมัครสินเชื่อ</h2>
    <p>UID ของคุณ: <b id="userUID">1001</b></p>
    
    <div id="statusDisplay" class="status pending">กำลังโหลดข้อมูล...</div>
    <div class="time-counter" id="lastCheck">ระบบจะตรวจสอบข้อมูลใหม่อัตโนมัติทุกๆ 20 วินาที</div>
</div>

<script>
    // ** ใส่ข้อมูลของคุณตรงนี้ **
    const USER_CONFIG = {
        owner: "your-username", // ใส่ Username GitHub
        repo: "loan-system",    // ใส่ชื่อ Repo
        path: "loans.json",
        myUID: "1001"           // ลองเปลี่ยนเป็น 1001 หรือ 1002 เพื่อทดสอบ
    };

    async function checkStatus() {
        // เพิ่ม timestamp ป้องกัน Browser จดจำ Cache (ทำให้ดึงไฟล์ใหม่จาก GitHub เสมอ)
        const rawUrl = `https://raw.githubusercontent.com/${USER_CONFIG.owner}/${USER_CONFIG.repo}/main/${USER_CONFIG.path}?nocache=${new Date().getTime()}`;
        
        try {
            const res = await fetch(rawUrl);
            const data = await res.json();
            
            const myData = data.find(item => item.uid === USER_CONFIG.myUID);
            const display = document.getElementById("statusDisplay");

            if (myData) {
                if (myData.status === "approved") {
                    display.className = "status approved";
                    display.innerHTML = ` ยินดีด้วย! อนุมัติแล้ว<br>วงเงิน: ${myData.amount.toLocaleString()} บาท<br>ระยะเวลา: ${myData.days} วัน`;
                } else if (myData.status === "rejected") {
                    display.className = "status rejected";
                    display.innerText = " คำขอของคุณไม่ได้รับการอนุมัติ";
                } else {
                    display.className = "status pending";
                    display.innerText = "⏳ กำลังรอการพิจารณา...";
                }
            } else {
                display.innerText = "ไม่พบข้อมูล UID นี้";
            }

            document.getElementById("lastCheck").innerText = `ตรวจสอบล่าสุดเมื่อ: ${new Date().toLocaleTimeString()}`;
        } catch (err) {
            console.error("Error fetching data:", err);
        }
    }

    // เรียกทำงานครั้งแรกทันที
    checkStatus();

    // ตั้งเวลาให้ดึงข้อมูลอัตโนมัติทุกๆ 20 วินาที (20000ms)
    setInterval(checkStatus, 20000);
</script>
</body>
</html>
