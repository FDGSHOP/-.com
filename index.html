<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บริการขอสินเชื่อ - EasyLoan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        .rgb-border { position: relative; background: #1e293b; border-radius: 1rem; }
        .rgb-border::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bfd, #7a00ff, #ff00c8, #ff0000);
            border-radius: 1.1rem; z-index: -1; background-size: 400%; animation: glowing 20s linear infinite;
        }
        @keyframes glowing { 0% { background-position: 0 0; } 50% { background-position: 400% 0; } 100% { background-position: 0 0; } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="p-3 bg-slate-800 border-b border-slate-700 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <h1 class="text-sm font-bold text-indigo-400 flex items-center">
            <i class="fa-solid fa-shield-halved mr-1.5 text-indigo-500"></i> EasyLoan Customer
        </h1>
        <div class="flex items-center space-x-2">
            <button onclick="resetClientData()" class="bg-rose-600 hover:bg-rose-500 text-white text-[10px] font-bold px-2 py-1 rounded">ล้างข้อมูลค้าง</button>
            <button onclick="alert('ระบบบันทึก Bookmark PWA เรียบร้อยแล้ว')" class="bg-emerald-600 text-white text-[11px] font-semibold px-2.5 py-1 rounded-lg">ติดตั้งแอป</button>
        </div>
    </header>

    <main class="w-full max-w-md mx-auto p-4 flex-grow space-y-4">
        <div id="statusBanner" class="hidden p-4 rounded-xl border text-xs space-y-2"></div>

        <!-- Card สรุปเมื่ออนุมัติ -->
        <div id="activeLoanCard" class="hidden rgb-border p-5 text-white shadow-2xl space-y-4">
            <div class="flex justify-between items-start border-b border-slate-700/60 pb-3">
                <div>
                    <span class="text-[11px] text-indigo-300 font-semibold uppercase">แดชบอร์ดสรุปสัญญาเงินกู้</span>
                    <h2 class="text-3xl font-black text-emerald-400 mt-0.5" id="dashTotalDebt">0 ฿</h2>
                </div>
                <span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-xs px-2.5 py-1 rounded-full font-medium">สัญญาอนุมัติ</span>
            </div>
            <div class="bg-slate-800/80 p-3 rounded-lg border border-slate-700/50 text-xs space-y-1.5">
                <div class="flex justify-between"><span>เงินต้น:</span><span id="breakdownPrincipal">0 ฿</span></div>
                <div class="flex justify-between"><span>ดอกเบี้ย (20%):</span><span id="breakdownInterest">0 ฿</span></div>
                <div id="fineRow" class="hidden flex justify-between text-rose-400 font-bold border-t border-slate-700/50 pt-1">
                    <span>ค่าปรับล่าช้า (วันละ 50 ฿):</span><span id="breakdownFine">0 ฿</span>
                </div>
            </div>
        </div>

        <!-- แบบฟอร์มยื่นกู้ -->
        <form id="loanApplyForm" onsubmit="event.preventDefault(); submitApplication();" class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
            <h3 class="text-xs font-bold text-slate-200 border-b border-slate-700 pb-2">แบบฟอร์มยื่นขอสินเชื่อ</h3>
            
            <div>
                <label class="block text-xs text-slate-400 mb-1">วงเงินที่ต้องการกู้ *</label>
                <select id="loanAmount" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs font-bold text-emerald-400">
                    <option value="1000">1,000 บาท (ดอกเบี้ย 200 บาท)</option>
                    <option value="2000">2,000 บาท (ดอกเบี้ย 400 บาท)</option>
                    <option value="3000">3,000 บาท (ดอกเบี้ย 600 บาท)</option>
                </select>
            </div>

            <input type="text" id="custName" required placeholder="ชื่อ-นามสกุล *" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
            <input type="tel" id="custPhone" required maxlength="10" placeholder="เบอร์โทรศัพท์หลัก *" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
            <input type="tel" id="custPhoneBackup" required maxlength="10" placeholder="เบอร์โทรศัพท์สำรอง *" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
            <input type="url" id="custFacebook" required placeholder="ลิงก์ Facebook *" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">

            <div class="p-3 bg-slate-900/80 rounded-lg border border-slate-700 space-y-2">
                <label class="block text-xs font-semibold text-indigo-400">บัญชีธนาคารสำหรับรับเงินโอน</label>
                <select id="bankName" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white">
                    <option value="กสิกรไทย">กสิกรไทย (KBANK)</option>
                    <option value="ไทยพาณิชย์">ไทยพาณิชย์ (SCB)</option>
                    <option value="กรุงไทย">กรุงไทย (KTB)</option>
                    <option value="กรุงเทพ">กรุงเทพ (BBL)</option>
                </select>
                <input type="text" id="bankAccountNo" required placeholder="เลขที่บัญชี" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white">
            </div>

            <input type="text" id="custJob" required placeholder="อาชีพปัจจุบัน *" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
            <input type="number" id="custIncome" required placeholder="รายได้ต่อเดือน (บาท) *" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
            <textarea id="custAddress" required rows="2" placeholder="ที่อยู่ปัจจุบัน / จุดสังเกตบ้าน *" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white"></textarea>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg text-sm shadow-lg shadow-indigo-600/30">
                ส่งข้อมูลยื่นขอสินเชื่อ
            </button>
        </form>
    </main>

    <script>
        // ใช้ LocalStorage แบบยืดหยุ่น ซิงค์ได้ทุกสภาวะ
        document.addEventListener("DOMContentLoaded", checkStatus);
        window.addEventListener('storage', checkStatus);

        function submitApplication() {
            const payload = {
                amount: document.getElementById('loanAmount').value,
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                phoneBackup: document.getElementById('custPhoneBackup').value,
                facebook: document.getElementById('custFacebook').value,
                bankName: document.getElementById('bankName').value,
                bankAccountNo: document.getElementById('bankAccountNo').value,
                job: document.getElementById('custJob').value,
                income: document.getElementById('custIncome').value,
                address: document.getElementById('custAddress').value,
                daysOverdue: 0,
                status: 'PENDING',
                timestamp: new Date().toLocaleString('th-TH')
            };

            localStorage.setItem('active_loan', JSON.stringify(payload));
            alert('ส่งคำขอสินเชื่อเรียบร้อยแล้ว!');
            checkStatus();
        }

        function checkStatus() {
            const data = localStorage.getItem('active_loan');
            const banner = document.getElementById('statusBanner');
            const applyForm = document.getElementById('loanApplyForm');
            const activeCard = document.getElementById('activeLoanCard');

            if (!data) {
                banner.classList.add('hidden');
                applyForm.classList.remove('hidden');
                activeCard.classList.add('hidden');
                return;
            }

            const loan = JSON.parse(data);

            if (loan.status === 'PENDING') {
                banner.className = "p-4 rounded-xl border bg-amber-500/10 border-amber-500/30 text-amber-300 text-xs space-y-1";
                banner.innerHTML = `<div class="font-bold text-amber-400"><i class="fa-solid fa-clock mr-1"></i>อยู่ระหว่างรอแอนมินอนุมัติ</div><p class="text-slate-300">กรุณาเปิดหน้า admin.html บน PC เพื่อกดอนุมัติ</p>`;
                banner.classList.remove('hidden');
                applyForm.classList.add('hidden');
                activeCard.classList.add('hidden');
            } else if (loan.status === 'APPROVED') {
                banner.classList.add('hidden');
                applyForm.classList.add('hidden');
                activeCard.classList.remove('hidden');

                const principal = parseFloat(loan.amount);
                const interest = principal * 0.20;
                const fineDays = parseInt(loan.daysOverdue || 0);
                const fineTotal = fineDays * 50;
                const totalDebt = Math.round(principal + interest + fineTotal);

                document.getElementById('dashTotalDebt').innerText = totalDebt.toLocaleString() + ' ฿';
                document.getElementById('breakdownPrincipal').innerText = Math.round(principal).toLocaleString() + ' ฿';
                document.getElementById('breakdownInterest').innerText = Math.round(interest).toLocaleString() + ' ฿';
                
                if (fineDays > 0) {
                    document.getElementById('fineRow').classList.remove('hidden');
                    document.getElementById('breakdownFine').innerText = Math.round(fineTotal).toLocaleString() + ' ฿';
                } else {
                    document.getElementById('fineRow').classList.add('hidden');
                }
            }
        }

        function resetClientData() {
            localStorage.removeItem('active_loan');
            checkStatus();
            alert('ล้างข้อมูลค้างสำเร็จ สามารถทดลองกรอกใหม่ได้ทันที');
        }
    </script>
</body>
</html>
