<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สินเชื่อออนไลน์คนพะเยา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>* { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex justify-center items-center">

    <div class="w-full max-w-md space-y-4">
        <!-- Header UID -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-lg">
            <div>
                <p class="text-[10px] text-indigo-400 font-semibold tracking-wider uppercase">รหัสเครื่องประจำตัว (UID)</p>
                <p id="displayUid" class="text-sm font-mono font-bold text-white">กำลังสร้าง UID...</p>
            </div>
            <div id="statusBadge" class="bg-slate-800 text-slate-400 text-xs px-3 py-1 rounded-full font-medium border border-slate-700">
                พร้อมใช้งาน
            </div>
        </div>

        <!-- Form คำขอกู้ -->
        <div id="loanCard" class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4 shadow-xl">
            <h2 class="text-base font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-hand-holding-dollar text-emerald-400"></i> ยื่นขอสินเชื่อ (1,000 - 10,000 ฿)
            </h2>
            
            <div class="space-y-1">
                <label class="text-xs text-slate-400">วงเงินกู้ที่ต้องการ (บาท)</label>
                <input type="number" id="loanAmount" min="1000" max="10000" step="500" value="3000" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-emerald-400 font-bold focus:outline-none focus:border-emerald-500">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-xs text-slate-400">ระยะเวลาผ่อน</label>
                    <select id="payPeriod" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <option value="7">รายสัปดาห์ (7 วัน)</option>
                        <option value="30">รายเดือน (30 วัน)</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-slate-400">จังหวะการจ่าย</label>
                    <select id="payInterval" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <option value="1">จ่ายทุกวัน</option>
                        <option value="3">จ่ายทุกๆ 3 วัน</option>
                    </select>
                </div>
            </div>

            <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 space-y-1 text-xs">
                <div class="flex justify-between text-slate-400"><span>รวมยอดชำระ (+ดอก 20%):</span><span id="txtTotal" class="text-white font-semibold">3,600 ฿</span></div>
                <div class="flex justify-between text-slate-400"><span>ค่างวดปกติต่องวด:</span><span id="txtDaily" class="text-emerald-400 font-semibold">515 ฿</span></div>
                <div class="flex justify-between text-slate-400"><span>จ่ายเฉพาะดอกเบี้ย (ดอกลอย):</span><span id="txtFloating" class="text-amber-400 font-semibold">86 ฿/งวด</span></div>
            </div>

            <button onclick="submitLoan()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs transition duration-200">
                ส่งคำขอกู้เงิน
            </button>
        </div>

        <!-- Active Contract Card -->
        <div id="activeCard" class="hidden bg-slate-900 border border-indigo-900/50 p-5 rounded-2xl space-y-4 shadow-xl">
            <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-wider">สัญญากู้ปัจจุบัน</h3>
                <span id="contractIdTxt" class="text-xs font-mono text-slate-400">CN-XXXXXX</span>
            </div>
            
            <div class="text-center py-2">
                <p class="text-xs text-slate-400">ยอดหนี้คงเหลือปัจจุบัน</p>
                <p id="remainingBalTxt" class="text-3xl font-extrabold text-emerald-400 my-1">0 ฿</p>
                <p id="subInfoTxt" class="text-[11px] text-amber-400">ดอกลอยต่องวด: 0 ฿</p>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button onclick="showPaymentQr('full')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs">
                    ชำระค่างวดปกติ
                </button>
                <button onclick="showPaymentQr('interest_only')" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 rounded-xl text-xs">
                    จ่ายเฉพาะดอกเบี้ย
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxWsCZty6r1n5WbmvKZUGu85Wft-0tatAMjU7ou8RgSjfQ2ZMv3yvCnXY11ZOIabPa0sg/exec";
        let activeContractData = null;

        // ระบบจำ UID ประจำเครื่อง
        let clientUid = localStorage.getItem('phayao_uid');
        if (!clientUid) {
            clientUid = 'PY-' + Math.floor(100000 + Math.random() * 900000);
            localStorage.setItem('phayao_uid', clientUid);
        }
        document.getElementById('displayUid').innerText = clientUid;

        // คำนวณยอดเงิน
        function calcLoan() {
            const amt = Number(document.getElementById('loanAmount').value) || 0;
            const period = Number(document.getElementById('payPeriod').value);
            const interval = Number(document.getElementById('payInterval').value);
            
            const total = amt * 1.20;
            const rounds = Math.ceil(period / interval);
            const installment = Math.ceil(total / rounds);
            const floating = Math.ceil((amt * 0.20) / rounds);

            document.getElementById('txtTotal').innerText = total.toLocaleString() + ' ฿';
            document.getElementById('txtDaily').innerText = installment.toLocaleString() + ' ฿';
            document.getElementById('txtFloating').innerText = floating.toLocaleString() + ' ฿/งวด';
        }

        document.getElementById('loanAmount').addEventListener('input', calcLoan);
        document.getElementById('payPeriod').addEventListener('change', calcLoan);
        document.getElementById('payInterval').addEventListener('change', calcLoan);

        // ส่งคำขอกู้
        async function submitLoan() {
            const amt = document.getElementById('loanAmount').value;
            const period = document.getElementById('payPeriod').value;
            const interval = document.getElementById('payInterval').value;

            Swal.fire({ title: 'กำลังยื่นคำขอ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'create_loan',
                        uid: clientUid,
                        amount: amt,
                        pay_period: period,
                        pay_interval: interval
                    })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    Swal.fire({ icon: 'success', title: 'ยื่นคำขอสำเร็จ', text: 'รอแอดมินกดอนุมัติสัญญา' });
                    checkContractStatus();
                }
            } catch (e) {
                Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาดในการเชื่อมต่อ' });
            }
        }

        // แสดง QR Code ชำระเงิน
        function showPaymentQr(payType) {
            if(!activeContractData) return;

            let payAmount = 0;
            let titleText = '';

            if (payType === 'full') {
                payAmount = activeContractData.installment_amount;
                titleText = `ชำระค่างวดปกติ: ${payAmount.toLocaleString()} บาท`;
            } else {
                payAmount = activeContractData.floating_interest;
                titleText = `จ่ายเฉพาะดอกเบี้ย (ดอกลอย): ${payAmount.toLocaleString()} บาท`;
            }

            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PROMPTPAY-PAYAO-PAYMENT-${payAmount}-${clientUid}`;

            Swal.fire({
                title: titleText,
                html: `
                    <p class="text-xs text-gray-400 mb-3">สแกน QR Code หรือนำไปให้แอดมินสแกนหน้าร้าน</p>
                    <div class="flex justify-center my-2">
                        <img src="${qrUrl}" alt="QR Code Payment" class="rounded-xl border border-gray-300 p-2 bg-white">
                    </div>
                    <p class="text-[11px] text-gray-500 font-mono mt-2">UID: ${clientUid}</p>
                `,
                showCancelButton: true,
                confirmButtonText: 'ยืนยันแจ้งชำระเงินแล้ว',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#10b981'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    processPayment(payType, payAmount);
                }
            });
        }

        // ประมวลผลชำระเงิน
        async function processPayment(payType, amount) {
            Swal.fire({ title: 'กำลังบันทึกการชำระ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'payment',
                        uid: clientUid,
                        pay_type: payType,
                        pay_amount: amount,
                        method: 'promptpay'
                    })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    Swal.fire({ icon: 'success', title: 'บันทึกการชำระเงินเรียบร้อยแล้ว' });
                    checkContractStatus();
                }
            } catch (e) {
                Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาดในการบันทึก' });
            }
        }

        // ตรวจสอบสถานะสัญญา
        async function checkContractStatus() {
            try {
                const res = await fetch(`${API_URL}?uid=${clientUid}`);
                const response = await res.json();
                const contract = response.data;

                if (contract) {
                    activeContractData = contract;
                    const badge = document.getElementById('statusBadge');
                    
                    if (contract.status === 'closed') {
                        document.getElementById('loanCard').classList.remove('hidden');
                        document.getElementById('activeCard').classList.add('hidden');
                        badge.innerText = "กู้ซ้ำได้ทันที";
                        badge.className = "bg-emerald-950 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-800";
                    } else {
                        document.getElementById('loanCard').classList.add('hidden');
                        document.getElementById('activeCard').classList.remove('hidden');
                        
                        document.getElementById('contractIdTxt').innerText = contract.contract_id;
                        document.getElementById('remainingBalTxt').innerText = Number(contract.remaining_balance).toLocaleString() + ' ฿';
                        document.getElementById('subInfoTxt').innerText = `ค่างวดปกติ: ${contract.installment_amount} ฿ | ดอกลอยต่องวด: ${contract.floating_interest} ฿`;

                        badge.innerText = contract.status;
                        if(contract.status === 'approved') badge.className = "bg-emerald-950 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-800";
                        if(contract.status === 'pending') badge.className = "bg-amber-950 text-amber-400 text-xs px-3 py-1 rounded-full border border-amber-800";
                        if(contract.status === 'rejected') {
                            document.getElementById('loanCard').classList.remove('hidden');
                            document.getElementById('activeCard').classList.add('hidden');
                            badge.innerText = "คำขอถูกปฏิเสธ";
                            badge.className = "bg-rose-950 text-rose-400 text-xs px-3 py-1 rounded-full border border-rose-800";
                        }
                    }
                }
            } catch (e) { console.error('Sync Error:', e); }
        }

        checkContractStatus();
    </script>
</body>
</html>
