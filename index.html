<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบขอสินเชื่อออนไลน์</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #f8f9fa; padding-bottom: 70px; }
    .card-custom { max-width: 600px; margin: 20px auto; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    canvas { border: 1px dashed #ccc; background: #fff; width: 100%; height: 150px; border-radius: 8px; }
  </style>
</head>
<body>

<div class="container">
  <div class="card card-custom p-4 bg-white mt-4">
    <h4 class="text-center text-primary mb-4">ยื่นคำขอสินเชื่อออนไลน์</h4>
    
    <form id="loanForm">
      <div class="mb-3">
        <label class="form-label">ชื่อ-นามสกุล</label>
        <input type="text" class="form-control" id="fullname" required>
      </div>
      
      <div class="mb-3">
        <label class="form-label">เลขบัตรประชาชน (13 หลัก)</label>
        <input type="text" class="form-control" id="nationalId" maxlength="13" required>
      </div>

      <div class="mb-3">
        <label class="form-label">เบอร์โทรศัพท์</label>
        <input type="tel" class="form-control" id="phone" required>
      </div>

      <div class="row mb-3">
        <div class="col-6">
          <label class="form-label">ธนาคาร</label>
          <input type="text" class="form-control" id="bank" placeholder="เช่น กสิกรไทย" required>
        </div>
        <div class="col-6">
          <label class="form-label">เลขที่บัญชี</label>
          <input type="text" class="form-control" id="bankAcc" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">จำนวนเงินที่ต้องการกู้ (บาท)</label>
        <input type="number" class="form-control" id="amount" onchange="calculateLoan()" required>
      </div>

      <div class="p-3 bg-light rounded mb-3">
        <p class="mb-1">ดอกเบี้ย (20%): <strong id="txtInterest">0</strong> บาท</p>
        <p class="mb-0">ยอดรวมชำระคืน: <strong id="txtTotal" class="text-danger">0</strong> บาท</p>
      </div>

      <div class="mb-3">
        <label class="form-label">รูปถ่ายบัตรประชาชน</label>
        <input type="file" class="form-control" id="file1" accept="image/*" required>
      </div>

      <div class="mb-3">
        <label class="form-label">รูปถ่ายคู่กับบัตรประชาชน</label>
        <input type="file" class="form-control" id="file2" accept="image/*" required>
      </div>

      <div class="mb-3">
        <label class="form-label">ลายเซ็นผู้กู้</label>
        <canvas id="sigCanvas"></canvas>
        <button type="button" class="btn btn-sm btn-outline-secondary mt-1" onclick="clearCanvas()">ล้างลายเซ็น</button>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2">ส่งคำขอกู้เงิน</button>
    </form>
  </div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxvX1CSZpvq_58mPH4WYmtUzRYw2LXDGAx2aJyQLJuqzIIpeX3gabiQf0cdsU5DD-sNJw/exec";

  // Canvas Drawing setup
  const canvas = document.getElementById('sigCanvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;

  canvas.width = canvas.offsetWidth;
  canvas.height = 150;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
  canvas.addEventListener('mousemove', (e) => { if (isDrawing) { const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); } });
  canvas.addEventListener('mouseup', () => isDrawing = false);

  canvas.addEventListener('touchstart', (e) => { isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
  canvas.addEventListener('touchmove', (e) => { if (isDrawing) { e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); } });
  canvas.addEventListener('touchend', () => isDrawing = false);

  function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

  function calculateLoan() {
    const amt = parseFloat(document.getElementById('amount').value) || 0;
    const interest = amt * 0.20;
    const total = amt + interest;
    document.getElementById('txtInterest').innerText = interest.toLocaleString();
    document.getElementById('txtTotal').innerText = total.toLocaleString();
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      if (!file) resolve("");
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  document.getElementById('loanForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    Swal.fire({ title: 'กำลังส่งข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    try {
      const file1 = document.getElementById('file1').files[0];
      const file2 = document.getElementById('file2').files[0];
      
      const file1Base64 = await fileToBase64(file1);
      const file2Base64 = await fileToBase64(file2);
      const sigBase64 = canvas.toDataURL();

      const amt = parseFloat(document.getElementById('amount').value) || 0;
      const interest = amt * 0.20;
      const total = amt + interest;

      const payload = {
        action: 'submitLoan',
        fullname: document.getElementById('fullname').value,
        nationalId: document.getElementById('nationalId').value,
        phone: document.getElementById('phone').value,
        bank: document.getElementById('bank').value,
        bankAcc: document.getElementById('bankAcc').value,
        amount: amt,
        interest: interest,
        total: total,
        payType: 'รายวัน',
        dailyAmount: (total / 30).toFixed(2),
        gps: '',
        file1: file1Base64,
        file2: file2Base64,
        signature: sigBase64
      };

      const res = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (data.status === 'success') {
        Swal.fire('สำเร็จ!', `ส่งคำขอกู้เรียบร้อยแล้ว<br>รหัสอ้างอิง (UID): <strong>${data.uid}</strong>`, 'success');
        document.getElementById('loanForm').reset();
        clearCanvas();
      } else {
        Swal.fire('เกิดข้อผิดพลาด', data.message || 'ไม่สามารถส่งข้อมูลได้', 'error');
      }
    } catch (err) {
      Swal.fire('เกิดข้อผิดพลาด', err.message, 'error');
    }
  });
</script>
</body>
</html>
