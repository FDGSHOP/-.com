<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบชำระเงิน PromptPay</title>
    <!-- โหลด Tailwind CSS เพื่อความสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full mx-4">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-800">ชำระเงินค่าสินค้า / บริการ</h2>
      <p class="text-sm text-slate-500 mt-1">กรุณาระบุยอดเงินที่ต้องการชำระด้านล่าง</p>
    </div>

    <!-- ฟอร์มกรอกจำนวนเงินบนหน้าหลัก -->
    <div class="mb-6">
      <label class="block text-sm font-medium text-slate-700 mb-2">จำนวนเงิน (บาท)</label>
      <div class="relative">
        <input type="number" id="mainAmountInput" value="100" min="1" 
               class="w-full px-4 py-3 pl-10 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-lg font-semibold text-slate-700"
               placeholder="0.00">
        <span class="absolute left-3.5 top-3.5 text-slate-400 font-semibold">฿</span>
      </div>
    </div>

    <!-- ปุ่มเปิด Pop-up ชำระเงิน -->
    <button onclick="openPaymentModal()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-lg shadow-indigo-100 transition flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
      </svg>
      ดำเนินการชำระเงิน (QR Code)
    </button>
  </div>

  <!-- Pop-up Modal (รวม QR, ปุ่มบันทึก, และแนบสลิปไว้ในนี้ทั้งหมด) -->
  <div id="paymentModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 relative max-h-[90vh] overflow-y-auto">
      
      <!-- ปุ่มปิด Pop-up -->
      <button onclick="closePaymentModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1 rounded-full hover:bg-slate-100 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>

      <!-- หัวข้อ Pop-up -->
      <div class="text-center mb-5">
        <h3 class="text-xl font-bold text-slate-800">สแกนเพื่อชำระเงิน</h3>
        <p class="text-xs text-slate-500 mt-0.5">พร้อมเพย์ (PromptPay)</p>
      </div>

      <!-- 1. ส่วนแสดง QR Code และยอดเงิน -->
      <div class="flex flex-col items-center bg-slate-50 p-4 rounded-2xl border border-slate-100 mb-4">
        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 mb-2">
          <img id="qrCodeImage" src="" alt="PromptPay QR Code" class="w-44 h-44 object-contain">
        </div>
        <p class="text-sm font-semibold text-slate-600">ยอดชำระ: <span id="displayAmount" class="text-indigo-600 text-lg">0.00</span> บาท</p>
      </div>

      <!-- 2. ปุ่มบันทึก QR Code -->
      <button onclick="downloadQRCode()" class="w-full mb-4 py-2.5 px-4 border border-indigo-600 text-indigo-600 hover:bg-indigo-50 font-medium rounded-xl transition flex items-center justify-center gap-2 text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
        </svg>
        บันทึก QR Code
      </button>

      <!-- เส้นคั่น -->
      <div class="border-t border-slate-100 my-4"></div>

      <!-- 3. ส่วนแนบสลิป -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-slate-700 mb-2">แนบหลักฐานการชำระเงิน (สลิป)</label>
        <label class="flex flex-col items-center justify-center w-full h-24 border-2 border-slate-300 border-dashed rounded-xl cursor-pointer bg-slate-50 hover:bg-slate-100 transition">
          <div class="flex flex-col items-center justify-center pt-3 pb-4 px-4 text-center">
            <svg class="w-6 h-6 mb-1 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <p class="text-xs text-slate-500"><span class="font-semibold text-indigo-600">คลิกเพื่ออัปโหลดสลิป</span> หรือลากไฟล์มาวาง</p>
            <p id="fileName" class="text-xs text-slate-600 mt-1 font-medium truncate max-w-[250px]"></p>
          </div>
          <input type="file" class="hidden" accept="image/*" onchange="handleFileSelect(event)">
        </label>
      </div>

      <!-- ปุ่มยืนยันการชำระเงิน -->
      <button onclick="submitPayment()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-lg shadow-indigo-100 transition">
        ยืนยันการชำระเงิน
      </button>

    </div>
  </div>

  <script>
    // ⚠️ เปลี่ยนเบอร์โทรศัพท์พร้อมเพย์ของคุณตรงนี้ (หรือใส่เลขประจำตัวผู้เสียภาษี)
    const promptPayNumber = "0812345678"; 

    function openPaymentModal() {
      let amount = document.getElementById('mainAmountInput').value;
      
      // ตรวจสอบความถูกต้องของตัวเลข
      if (!amount || amount <= 0) {
        alert('กรุณากรอกจำนวนเงินให้ถูกต้องก่อนทำรายการ');
        document.getElementById('mainAmountInput').focus();
        return;
      }

      // อัปเดตตัวเลขแสดงผลใน Pop-up
      document.getElementById('displayAmount').innerText = parseFloat(amount).toLocaleString('th-TH', {minimumFractionDigits: 2});
      
      // อัปเดตลิงก์รูปภาพ QR Code พร้อมเพย์ตามยอดที่ลูกค้ากรอก
      document.getElementById('qrCodeImage').src = `https://promptpay.io/${promptPayNumber}/${amount}.png`;

      // แสดง Pop-up
      document.getElementById('paymentModal').classList.remove('hidden');
    }

    function closePaymentModal() {
      document.getElementById('paymentModal').classList.add('hidden');
    }

    function downloadQRCode() {
      const imageUrl = document.getElementById('qrCodeImage').src;
      const a = document.createElement('a');
      a.href = imageUrl;
      a.download = 'promptpay-qrcode.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        document.getElementById('fileName').innerText = `ไฟล์ที่เลือก: ${file.name}`;
      }
    }

    function submitPayment() {
      // ตรงนี้สามารถเพิ่มโค้ดส่งข้อมูลไปยัง Backend (เช่น ส่งรูปสลิปและยอดเงิน) ได้ตามต้องการ
      alert('บันทึกข้อมูลการชำระเงินเรียบร้อยแล้ว!');
      closePaymentModal();
    }
  </script>

</body>
</html>
