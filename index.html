<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบไรเดอร์รับเงินสด - ครบวงจร</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* --- Loading Screen Styles --- */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner-container {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .loading-text {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-top: 15px;
        }

        /* Success Checkmark Animation */
        .success-checkmark {
            display: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #4CAF50;
            position: relative;
            animation: scaleIn 0.3s ease-in-out forwards;
        }

        .success-checkmark::after {
            content: '';
            position: absolute;
            left: 28px;
            top: 13px;
            width: 20px;
            height: 40px;
            border: solid white;
            border-width: 0 6px 6px 0;
            transform: rotate(45deg);
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- Form & Camera Styles --- */
        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .camera-box {
            position: relative;
            width: 100%;
            height: 250px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        video, canvas, #preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }

        .btn-secondary {
            background-color: #ff9800;
        }

        .action-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-check { background-color: #4CAF50; flex: 1; font-size: 20px; }
        .btn-cross { background-color: #f44336; flex: 1; font-size: 20px; }

        .hidden { display: none !important; }
        
        #time-badge {
            background: #333;
            color: #ffeb3b;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 15px;
            display: block;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 1. หน้าโหลด 0 ถึง 100% พร้อมอนิเมชั่นติ๊กถูก -->
    <div id="loading-overlay">
        <div class="spinner-container">
            <div id="loader-number" class="loading-text" style="position: absolute; width: 100%; text-align: center; top: 25px; font-size: 18px;">0%</div>
        </div>
        <div class="success-checkmark" id="success-icon"></div>
        <div class="loading-text" id="loading-label">กำลังโหลดระบบ...</div>
    </div>

    <!-- 2. ส่วนของระบบไรเดอร์รับเงินสด (ครบวงจร) -->
    <div class="container">
        <h2>ส่งยอดเงินสดรายวัน</h2>
        <div id="time-badge">⏳ กำลังซิงค์เวลาประเทศไทย...</div>
        
        <!-- ฟอร์มกรอกข้อมูลเพิ่มเติม (ที่เพิ่มเข้ามาให้ครบถ้วน) -->
        <div class="form-group">
            <label>ชื่อไรเดอร์ / รหัสพนักงาน</label>
            <input type="text" id="rider-name" class="form-control" placeholder="ระบุชื่อหรือรหัสของคุณ">
        </div>

        <div class="form-group">
            <label>ยอดเงินสดที่รับ (บาท)</label>
            <input type="number" id="cash-amount" class="form-control" placeholder="0.00">
        </div>

        <div class="form-group">
            <label>หลักฐานรูปถ่าย</label>
        </div>

        <div class="camera-box">
            <video id="video" autoplay playsinline></video>
            <img id="preview-img" class="hidden" alt="Preview">
            <canvas id="canvas" class="hidden"></canvas>
        </div>

        <!-- ปุ่มควบคุมกล้องปกติ -->
        <div id="camera-controls">
            <button class="btn btn-secondary" id="switch-camera-btn" type="button">🔄 สลับกล้องหน้า/หลัง</button>
            <button class="btn" id="capture-btn" type="button">📸 ถ่ายรูปหลักฐาน</button>
        </div>

        <!-- ปุ่มยืนยัน (ติ๊กถูก / กากบาท) หลังจากถ่ายรูปแล้ว -->
        <div id="confirm-controls" class="action-buttons hidden">
            <button class="btn btn-cross" id="retake-btn" type="button" title="ถ่ายใหม่">❌ ถ่ายใหม่</button>
            <button class="btn btn-check" id="send-btn" type="button" title="ยืนยันส่งข้อมูล">✔️ ยืนยันส่ง</button>
        </div>
    </div>

    <script>
        // --- 1. หน้าโหลด (Loading & Success State) ---
        let currentProgress = 0;
        const numberEl = document.getElementById('loader-number');
        const labelEl = document.getElementById('loading-label');
        const successIcon = document.getElementById('success-icon');
        const loadingOverlay = document.getElementById('loading-overlay');

        const loadingInterval = setInterval(() => {
            currentProgress += Math.floor(Math.random() * 15) + 5; 
            if (currentProgress >= 100) {
                currentProgress = 100;
                clearInterval(loadingInterval);
                
                numberEl.style.display = 'none';
                labelEl.style.display = 'none';
                successIcon.style.display = 'block';

                setTimeout(() => {
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => {
                        loadingOverlay.style.display = 'none';
                    }, 500);
                }, 1200);
            }
            numberEl.innerText = currentProgress + '%';
        }, 150);


        // --- 2. ดึงเวลาประเทศไทยจาก Network API ---
        let verifiedThaiTimeStr = "";

        async function fetchThaiTime() {
            try {
                const response = await fetch('https://worldtimeapi.org/api/timezone/Asia/Bangkok');
                const data = await response.json();
                const datetime = new Date(data.datetime);
                
                const day = String(datetime.getDate()).padStart(2, '0');
                const month = String(datetime.getMonth() + 1).padStart(2, '0');
                const year = datetime.getFullYear();
                const hours = String(datetime.getHours()).padStart(2, '0');
                const minutes = String(datetime.getMinutes()).padStart(2, '0');
                const seconds = String(datetime.getSeconds()).padStart(2, '0');

                verifiedThaiTimeStr = `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;
                document.getElementById('time-badge').innerText = `🕒 เวลาจริง (ไทย): ${verifiedThaiTimeStr}`;
            } catch (error) {
                const fallbackDate = new Date();
                verifiedThaiTimeStr = fallbackDate.toLocaleString('th-TH');
                document.getElementById('time-badge').innerText = `⚠️ เวลาท้องถิ่น: ${verifiedThaiTimeStr}`;
            }
        }

        fetchThaiTime();


        // --- 3. ระบบกล้องและการถ่ายรูป + ประทับเวลาลงรูป ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const previewImg = document.getElementById('preview-img');
        const captureBtn = document.getElementById('capture-btn');
        const switchCameraBtn = document.getElementById('switch-camera-btn');
        const retakeBtn = document.getElementById('retake-btn');
        const sendBtn = document.getElementById('send-btn');
        const cameraControls = document.getElementById('camera-controls');
        const confirmControls = document.getElementById('confirm-controls');

        let useFrontCamera = false;
        let currentStream = null;
        let capturedBlob = null;

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: { facingMode: useFrontCamera ? "user" : "environment" }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (error) {
                alert("ไม่สามารถเปิดกล้องได้: " + error.message);
            }
        }

        switchCameraBtn.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        });

        // กดถ่ายรูป + วาดลายน้ำเวลาประเทศไทยลงบนรูป
        captureBtn.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // วาด Watermark เวลาลงบนภาพ
            if (verifiedThaiTimeStr) {
                context.fillStyle = 'rgba(0, 0, 0, 0.6)';
                context.fillRect(20, canvas.height - 70, canvas.width - 40, 50);

                context.font = 'bold 20px sans-serif';
                context.fillStyle = '#00FFCC';
                context.fillText(`📅 ${verifiedThaiTimeStr}`, 35, canvas.height - 38);
                
                context.font = '15px sans-serif';
                context.fillStyle = '#FFFFFF';
                context.fillText(`✔ ยืนยันรับเงินสดรายวัน`, 35, canvas.height - 15);
            }

            canvas.toBlob((blob) => {
                capturedBlob = blob;
                const imageUrl = URL.createObjectURL(blob);
                previewImg.src = imageUrl;

                video.classList.add('hidden');
                previewImg.classList.remove('hidden');
                cameraControls.classList.add('hidden');
                confirmControls.classList.remove('hidden');

                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
            }, 'image/jpeg');
        });

        // ปุ่มกากบาท ❌ (ถ่ายใหม่)
        retakeBtn.addEventListener('click', () => {
            previewImg.classList.add('hidden');
            video.classList.remove('hidden');
            confirmControls.classList.add('hidden');
            cameraControls.classList.remove('hidden');
            startCamera();
        });

        // ปุ่มติ๊กถูก ✔️ (ส่งข้อมูลไป Discord)
        sendBtn.addEventListener('click', async () => {
            const riderName = document.getElementById('rider-name').value.trim();
            const cashAmount = document.getElementById('cash-amount').value.trim();

            if (!riderName || !cashAmount) {
                alert("กรุณากรอกชื่อไรเดอร์และยอดเงินสดให้ครบถ้วนก่อนส่งข้อมูลครับ!");
                return;
            }

            if (!capturedBlob) return;

            alert("กำลังส่งข้อมูลและรูปภาพไปยัง Discord...");

            const formData = new FormData();
            formData.append('file', capturedBlob, 'rider_cash.jpg');
            formData.append('payload_json', JSON.stringify({
                content: `📦 **แจ้งส่งยอดเงินสดรายวัน**\n👤 **ไรเดอร์:** \`${riderName}\`\n💰 **ยอดเงิน:** \`${cashAmount} บาท\`\n🕒 **เวลาจริง (ไทย):** \`${verifiedThaiTimeStr}\``
            }));

            try {
                // แทนที่ลิงก์ด้านล่างด้วย Discord Webhook ของคุณ
                // const webhookURL = 'YOUR_DISCORD_WEBHOOK_URL_HERE';
                // const response = await fetch(webhookURL, { method: 'POST', body: formData });

                alert("ส่งข้อมูลเข้า Discord สำเร็จเรียบร้อย!");
                location.reload();
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการส่งข้อมูล: " + error.message);
            }
        });

        startCamera();
    </script>
</body>
</html>
