<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยื่นขอสินเชื่อ</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 40px; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 10px; width: 320px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; text-align: center; width: 260px; }
        
        .status-box { margin-top: 15px; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; }
        .pending { background: #fef08a; color: #854d0e; }
        .approved { background: #bbf7d0; color: #166534; }
        .rejected { background: #fecaca; color: #991b1b; }
    </style>
</head>
<body>

<div class="card">
    <div id="registerForm">
        <h2>ยื่นขอสินเชื่อ</h2>
        <div class="form-group"><label>เลข UID:</label><input type="text" id="uid" placeholder="เช่น 1001"></div>
        <div class="form-group"><label>ชื่อ-นามสกุล:</label><input type="text" id="name" placeholder="สมชาย ใจดี"></div>
        <div class="form-group"><label>วงเงินที่ขอ (บาท):</label><input type="number" id="amount" placeholder="เช่น 5000"></div>
        <div class="form-group"><label>จำนวนวัน:</label><input type="number" id="days" value="30"></div>
        <button id="submitBtn" onclick="submitData()">ส่งข้อมูลสมัคร</button>
    </div>

    <div id="statusSection" style="display:none;">
        <h2>สถานะสินเชื่อ</h2>
        <p>UID ของคุณ: <b id="userUidDisplay"></b></p>
        <div id="statusBox" class="status-box pending">กำลังตรวจสอบ...</div>
        <p style="font-size: 11px; color: #777; text-align: center; margin-top: 15px;">
            ระบบเช็กสถานะใหม่อัตโนมัติทุกๆ 20 วินาที
        </p>
    </div>
</div>

<div id="popup" class="modal">
    <div class="modal-content">
        <h3 style="color: #10b981; margin-top: 0;">ส่งข้อมูลสำเร็จ!</h3>
        <p>ระบบได้ส่งข้อมูลของคุณไปยังเจ้าหน้าที่เรียบร้อยแล้ว</p>
        <button style="background: #10b981;" onclick="closePopup()">ตกลง</button>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx51fB_rn_XjG__EI40j9UFRPPFU-Oqd5XY9TvtOqoI13Axkl1WOYJfc8aqucHVz6L-wiQ/exec";
    let myUID = "";

    async function submitData() {
        myUID = document.getElementById('uid').value.trim();
        const name = document.getElementById('name').value.trim();
        const amount = document.getElementById('amount').value;
        const days = document.getElementById('days').value;

        if(!myUID || !name || !amount) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "กำลังส่งข้อมูล...";

        try {
            await fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ 
                    action: "register", 
                    uid: myUID, 
                    name: name, 
                    amount: Number(amount), 
                    days: Number(days) 
                })
            });

            document.getElementById('popup').style.display = 'flex';
        } catch (err) {
            alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
            btn.disabled = false;
            btn.innerText = "ส่งข้อมูลสมัคร";
        }
    }

    function closePopup() {
        document.getElementById('popup').style.display = 'none';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('statusSection').style.display = 'block';
        document.getElementById('userUidDisplay').innerText = myUID;

        checkStatus();
        setInterval(checkStatus, 20000);
    }

    async function checkStatus() {
        try {
            const res = await fetch(GAS_URL);
            const data = await res.json();
            const myData = data.find(item => item.uid.toString() === myUID.toString());
            
            const box = document.getElementById('statusBox');
            if(myData) {
                if(myData.status === 'approved') {
                    box.className = "status-box approved";
                    box.innerHTML = `อนุมัติแล้ว!<br>วงเงิน: ${Number(myData.amount).toLocaleString()} บาท<br>ระยะเวลา: ${myData.days} วัน`;
                } else if(myData.status === 'rejected') {
                    box.className = "status-box rejected";
                    box.innerText = "คำขอของคุณไม่ได้รับการอนุมัติ";
                } else {
                    box.className = "status-box pending";
                    box.innerText = "⏳ กำลังรอเจ้าหน้าที่พิจารณา...";
                }
            }
        } catch (err) {
            console.error("Fetch status error:", err);
        }
    }
</script>
</body>
</html>
