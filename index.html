<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงทะเบียนและจัดการการชำระเงิน</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --success-color: #059669;
            --warning-color: #d97706;
            --danger-color: #dc2626;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Card Component */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border-color);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .card-header i {
            font-size: 1.4rem;
            color: var(--primary-color);
        }

        .card-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* 1. Camera Section */
        .camera-container {
            position: relative;
            width: 100%;
            height: 280px;
            background-color: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #94a3b8;
        }

        video, #photo-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-warning { background-color: var(--warning-color); color: white; }
        .btn-success { background-color: var(--success-color); color: white; }
        .btn-outline { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-sub); }

        .upload-divider {
            text-align: center;
            position: relative;
            margin: 15px 0;
            color: var(--text-sub);
            font-size: 0.875rem;
        }

        .upload-divider::before, .upload-divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background-color: var(--border-color);
        }

        .upload-divider::before { left: 0; }
        .upload-divider::after { right: 0; }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* 2. Inbox Section */
        .inbox-card {
            background: #fffbeb;
            border: 1px solid #fde68a;
        }

        .inbox-card .card-header i { color: var(--warning-color); }

        .notice-box {
            padding: 12px 16px;
            background-color: #ffffff;
            border-radius: 8px;
            border-left: 4px solid var(--warning-color);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* 3. Payment History Section */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .info-item {
            background-color: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
        }

        .info-label {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-pending { background-color: #fef3c7; color: #92400e; }
        .status-success { background-color: #d1fae5; color: #065f46; }

        .qr-section {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
        }

        .qr-image-wrapper {
            margin-top: 12px;
            display: inline-block;
            padding: 12px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
        }

        .qr-image-wrapper img {
            width: 180px;
            height: 180px;
        }

        /* Utility */
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="main-container">

    <!-- Section 1: กล้องสมัครสมาชิก / อัปโหลดเอกสาร -->
    <div class="card">
        <div class="card-header">
            <i class="fa-solid fa-id-card"></i>
            <h2 id="step-title">สมัครสมาชิก (1/2): ถ่ายรูปหน้าบัตรประชาชน</h2>
        </div>

        <div class="camera-container">
            <video id="webcam" autoplay playsinline></video>
            <img id="photo-preview" class="hidden" alt="ภาพตัวอย่าง">
        </div>
        <canvas id="canvas" class="hidden"></canvas>

        <div class="btn-group">
            <button id="btn-capture" class="btn btn-primary" onclick="takeSnapshot()">
                <i class="fa-solid fa-camera"></i> ถ่ายภาพ
            </button>
            <button id="btn-retake" class="btn btn-warning hidden" onclick="resetCamera()">
                <i class="fa-solid fa-rotate-left"></i> ถ่ายใหม่ (หากภาพไม่ชัด)
            </button>
            <button id="btn-confirm" class="btn btn-success hidden" onclick="confirmPhoto()">
                <i class="fa-solid fa-circle-check"></i> ยืนยันภาพชัดเจน - ขั้นตอนถัดไป
            </button>
        </div>

        <div class="upload-divider">หรือใช้วิธี</div>

        <div class="file-input-wrapper">
            <button class="btn btn-outline">
                <i class="fa-solid fa-file-arrow-up"></i> อัปโหลดรูปภาพจากอุปกรณ์
            </button>
            <input type="file" id="file-upload" accept="image/*" onchange="uploadFromFile(event)">
        </div>
    </div>

    <!-- Section 2: กล่องแจ้งเตือน / ค่าปรับ -->
    <div class="card inbox-card">
        <div class="card-header">
            <i class="fa-solid fa-envelope-open-text"></i>
            <h2>กล่องจดหมาย / แจ้งเตือน</h2>
        </div>
        <div id="inbox-content">
            <div class="notice-box">
                <i class="fa-solid fa-circle-info"></i> ไม่มีรายการแจ้งเตือนใหม่ในขณะนี้
            </div>
        </div>
    </div>

    <!-- Section 3: ประวัติการชำระเงิน และ QR Pay -->
    <div class="card">
        <div class="card-header">
            <i class="fa-solid fa-receipt"></i>
            <h2>ประวัติการชำระเงิน</h2>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">รหัสผู้ใช้ (UID)</div>
                <div class="info-value" id="user-uid">UID123456</div>
            </div>
            <div class="info-item">
                <div class="info-label">สถานะปัจจุบัน</div>
                <div>
                    <span id="payment-status" class="status-badge status-pending">
                        <i class="fa-solid fa-clock"></i> รอตรวจสอบ (ℹ️)
                    </span>
                </div>
            </div>
        </div>

        <div class="info-item" style="margin-bottom: 15px;">
            <div class="info-label">ยอดหนี้คงค้างสุทธิ</div>
            <div class="info-value" style="color: var(--danger-color); font-size: 1.4rem;">
                <span id="debt-amount">1000</span> บาท
            </div>
        </div>

        <div class="qr-section">
            <button class="btn btn-success" onclick="generatePromptPayQR()">
                <i class="fa-solid fa-qrcode"></i> ชำระเงินด้วย QR Pay
            </button>
            
            <div id="qr-display" class="qr-image-wrapper hidden">
                <!-- QR Code แสดงผลที่นี่ -->
            </div>
        </div>
    </div>

</div>

<script>
    // Config ตั้งค่าหลัก
    const currentUID = "UID123456"; // UID ประจำตัวลูกค้า
    let baseDebt = 1000;             // ยอดหนี้ตั้งต้น
    let registrationStep = 1;       // ขั้นตอนการถ่ายภาพ (1 = หน้าบัตร, 2 = คู่กับใบหน้า)
    let cardImage = null;
    let faceImage = null;

    const video = document.getElementById('webcam');
    const preview = document.getElementById('photo-preview');
    const canvas = document.getElementById('canvas');

    // --- LOGIC 1: ระบบกล้องถ่ายรูป 2 ขั้นตอน ---
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
            });
            video.srcObject = stream;
        } catch (e) {
            console.warn("ไม่สามารถเปิดใช้งานกล้องได้ หรือเบราว์เซอร์ไม่ได้รับสิทธิ์เข้าถึง");
        }
    }

    function takeSnapshot() {
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const dataUrl = canvas.toDataURL('image/jpeg');
        preview.src = dataUrl;
        
        video.classList.add('hidden');
        preview.classList.remove('hidden');

        document.getElementById('btn-capture').classList.add('hidden');
        document.getElementById('btn-retake').classList.remove('hidden');
        document.getElementById('btn-confirm').classList.remove('hidden');

        if (registrationStep === 1) cardImage = dataUrl;
        else faceImage = dataUrl;
    }

    function resetCamera() {
        video.classList.remove('hidden');
        preview.classList.add('hidden');
        document.getElementById('btn-capture').classList.remove('hidden');
        document.getElementById('btn-retake').classList.add('hidden');
        document.getElementById('btn-confirm').classList.add('hidden');
    }

    function confirmPhoto() {
        if (registrationStep === 1) {
            registrationStep = 2;
            document.getElementById('step-title').innerText = "สมัครสมาชิก (2/2): ถ่ายรูปคู่กับบัตรประชาชน";
            resetCamera();
        } else {
            alert("อัปโหลดรูปถ่ายลงทะเบียนครบทั้ง 2 ขั้นตอนเรียบร้อยแล้ว!");
        }
    }

    function uploadFromFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            if (registrationStep === 1) {
                cardImage = e.target.result;
                alert("อัปโหลดรูปหน้าบัตรเรียบร้อยแล้ว! กรุณาอัปโหลดรูปคู่กับบัตรประชาชนต่อ");
                registrationStep = 2;
                document.getElementById('step-title').innerText = "สมัครสมาชิก (2/2): ถ่ายรูปคู่กับบัตรประชาชน";
            } else {
                faceImage = e.target.result;
                alert("อัปโหลดไฟล์รูปภาพครบถ้วนแล้ว!");
            }
        };
        reader.readAsDataURL(file);
    }

    // --- LOGIC 2 & 3: ดึงข้อมูลการตัดยอด/ค่าปรับ จาก GitHub (data.json) ---
    async function fetchSystemData() {
        try {
            // ดึงข้อมูลแบบไม่ค้าง Cache เพื่ออัปเดต Real-time
            const res = await fetch('./data.json?cache=' + Date.now());
            if (!res.ok) return;
            const data = await res.json();

            // 1. ตรวจสอบค่าปรับ
            const penalty = data.penalties?.find(p => p.uid === currentUID);
            let totalPenalty = 0;
            if (penalty) {
                totalPenalty = penalty.amount;
                document.getElementById('inbox-content').innerHTML = `
                    <div class="notice-box">
                        <b style="color: var(--danger-color);"><i class="fa-solid fa-triangle-exclamation"></i> แจ้งเตือนค่าปรับชำระล่าช้า:</b><br>
                        ${penalty.reason}<br>
                        ยอดค่าปรับเพิ่มเติม: <b>${penalty.amount}</b> บาท
                    </div>
                `;
            }

            // 2. ตรวจสอบการหักลบยอดเงินอนุมัติ
            const approval = data.approved_payments?.find(a => a.uid === currentUID);
            let finalBalance = baseDebt + totalPenalty;

            if (approval) {
                finalBalance -= approval.amount;
                if (finalBalance <= 0) {
                    finalBalance = 0;
                    const statusTag = document.getElementById('payment-status');
                    statusTag.innerHTML = `<i class="fa-solid fa-circle-check"></i> ชำระเงินสำเร็จแล้ว`;
                    statusTag.className = "status-badge status-success";
                }
            }

            document.getElementById('debt-amount').innerText = finalBalance;

        } catch (err) {
            console.log("อยู่ในโหมดออฟไลน์ หรือยังไม่ได้สร้างไฟล์ data.json");
        }
    }

    // --- LOGIC 4: เจน QR Code PromptPay ตามยอดคงค้างสด ---
    function generatePromptPayQR() {
        const amount = document.getElementById('debt-amount').innerText;
        const qrDisplay = document.getElementById('qr-display');
        const promptPayID = "0812345678"; // <--- เปลี่ยนเป็นเบอร์พร้อมเพย์ของคุณที่นี่

        qrDisplay.innerHTML = `
            <p style="font-size: 0.875rem; color: var(--text-sub); margin-bottom: 8px;">สแกนชำระยอดสุทธิ <b>${amount}</b> บาท</p>
            <img src="https://promptpay.io/${promptPayID}/${amount}.png" alt="PromptPay QR Code">
        `;
        qrDisplay.classList.remove('hidden');
    }

    // เรียกทำงานระบบอัตโนมัติเมื่อเปิดหน้าเว็บ
    window.addEventListener('DOMContentLoaded', () => {
        startCamera();
        fetchSystemData();
    });
</script>

</body>
</html>
