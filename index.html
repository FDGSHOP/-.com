<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบขอสินเชื่อและบริการลูกค้า</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        .rgb-border {
            position: relative;
            background: #1e293b;
            border-radius: 1rem;
        }
        .rgb-border::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bfd, #7a00ff, #ff00c8, #ff0000);
            border-radius: 1.1rem;
            z-index: -1;
            background-size: 400%;
            animation: glowing 20s linear infinite;
        }
        @keyframes glowing {
            0% { background-position: 0 0; }
            50% { background-position: 400% 0; }
            100% { background-position: 0 0; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20">

    <!-- Header -->
    <header class="p-4 bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-40 flex justify-between items-center shadow-lg">
        <h1 class="text-base font-bold text-indigo-400 flex items-center">
            <i class="fa-solid fa-shield-halved mr-2 text-indigo-500"></i>บริการสินเชื่อ
        </h1>
        
        <div class="flex items-center space-x-2">
            <!-- ปุ่มติดตั้ง PWA -->
            <button id="pwaInstallBtn" onclick="installPwaApp()" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-2.5 py-1 rounded-lg shadow border border-emerald-500/50 flex items-center animate-pulse">
                <i class="fa-solid fa-download mr-1"></i>ติดตั้งแอป
            </button>

            <div class="text-[10px] bg-slate-700/80 px-2 py-1 rounded-full border border-slate-600 text-slate-300">
                UID: <span id="displayUid" class="font-mono text-indigo-300">Loading...</span>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Banner แสดงสถานะการสมัครสินเชื่อ -->
        <div id="statusBanner" class="hidden p-4 rounded-xl border text-xs space-y-2">
            <!-- Rendered dynamically by JS (Pending / Approved / Rejected) -->
        </div>

        <!-- Loan Dashboard (จะแสดงเฉพาะเมื่ออนุมัติแล้วเท่านั้น) -->
        <div id="activeLoanCard" class="hidden rgb-border p-5 text-white shadow-2xl">
            <div class="flex justify-between items-start border-b border-slate-700/60 pb-3 mb-3">
                <div>
                    <span class="text-[11px] text-indigo-300 font-semibold uppercase tracking-wider">แดชบอร์ดสัญญาเงินกู้</span>
                    <h2 class="text-2xl font-black text-emerald-400 mt-0.5" id="dashTotalDebt">0 ฿</h2>
                    <p class="text-[11px] text-slate-400">อัตราดอกเบี้ย 20%</p>
                </div>
                <span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-xs px-2.5 py-1 rounded-full font-medium">สัญญาอนุมัติ</span>
            </div>

            <!-- Progress Bar -->
            <div class="space-y-1 mb-4">
                <div class="flex justify-between text-xs font-medium">
                    <span class="text-slate-400">ชำระแล้ว (<span id="payPercentText">0</span>%)</span>
                    <span class="text-emerald-400" id="paidAmountText">0 / 0 ฿</span>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-2.5 overflow-hidden">
                    <div id="payProgressBar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <button onclick="switchTab('payment')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-lg shadow-emerald-600/30">
                <i class="fa-solid fa-wallet mr-1.5"></i>ชำระเงิน
            </button>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700">
            <button id="tabBtnApply" onclick="switchTab('apply')" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition">ยื่นขอสินเชื่อ</button>
            <button id="tabBtnPay" onclick="switchTab('payment')" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition">ชำระเงิน</button>
            <button id="tabBtnLog" onclick="switchTab('log')" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition">สัญญา / ประวัติ</button>
        </div>

        <!-- 1. APPLY TAB (ฟอร์มสมัคร + ระบบ AI คัดกรอง) -->
        <section id="tabApply" class="space-y-4">
            <form id="loanApplyForm" onsubmit="event.preventDefault(); submitApplication();" class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4">
                <h3 class="text-base font-bold text-slate-200 border-b border-slate-700 pb-2">แบบฟอร์มยื่นขอสินเชื่อ</h3>
                
                <!-- วงเงินกู้ -->
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">วงเงินที่ต้องการกู้ (ดอกเบี้ย 20%) <span class="text-rose-400">*</span></label>
                    <select id="loanAmount" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs font-bold text-emerald-400 focus:outline-none">
                        <option value="" disabled selected>-- เลือกรอบวงเงิน --</option>
                        <option value="500">500 บาท (ดอกเบี้ย 100 บาท)</option>
                        <option value="1000">1,000 บาท (ดอกเบี้ย 200 บาท)</option>
                        <option value="1500">1,500 บาท (ดอกเบี้ย 300 บาท)</option>
                        <option value="2000">2,000 บาท (ดอกเบี้ย 400 บาท)</option>
                        <option value="2500">2,500 บาท (ดอกเบี้ย 500 บาท)</option>
                        <option value="3000">3,000 บาท (ดอกเบี้ย 600 บาท)</option>
                    </select>
                </div>

                <!-- ข้อมูลส่วนตัว & อาชีพ (สำหรับ AI ตรวจสอบ) -->
                <div class="space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">ชื่อ-นามสกุล <span class="text-rose-400">*</span></label>
                            <input type="text" id="custName" required placeholder="นาย สมชาย ใจดี" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">เบอร์โทรศัพท์ <span class="text-rose-400">*</span></label>
                            <input type="tel" id="custPhone" required maxlength="10" placeholder="08XXXXXXXX" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none">
                        </div>
                    </div>

                    <!-- ฟิลด์คัดกรอง AI -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">ระบุอาชีพปัจจุบัน <span class="text-rose-400">*</span></label>
                            <input type="text" id="custJob" required placeholder="เช่น พนักงานบริษัท, ค้าขาย" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">รายได้ต่อเดือน (บาท) <span class="text-rose-400">*</span></label>
                            <input type="number" id="custIncome" required placeholder="เช่น 15000" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-slate-400 mb-1">ที่อยู่ปัจจุบัน <span class="text-rose-400">*</span></label>
                        <textarea id="custAddress" required rows="2" placeholder="บ้านเลขที่ ถนน ตำบล อำเภอ จังหวัด" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">สถานที่ทำงาน / ร้านค้า <span class="text-rose-400">*</span></label>
                        <textarea id="workAddress" required rows="2" placeholder="ชื่อสถานที่ทำงาน หรือจุดสังเกต" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none"></textarea>
                    </div>
                </div>

                <!-- แนบไฟล์รูปภาพ -->
                <div class="space-y-3 pt-2 border-t border-slate-700">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1"><i class="fa-solid fa-id-card mr-1 text-indigo-400"></i>1. รูปถ่ายหน้าบัตรประชาชน <span class="text-rose-400">*</span></label>
                        <input type="file" id="fileIdCard" required accept="image/*" onchange="previewImage(this, 'previewIdCard')" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-indigo-600 file:text-white border border-slate-700 rounded-lg bg-slate-900">
                        <img id="previewIdCard" class="hidden mt-2 rounded-lg max-h-32 mx-auto border border-slate-700">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1"><i class="fa-solid fa-user-tag mr-1 text-indigo-400"></i>2. รูปถ่ายคู่บัตรประชาชนพร้อมใบหน้า <span class="text-rose-400">*</span></label>
                        <input type="file" id="fileSelfie" required accept="image/*" onchange="previewImage(this, 'previewSelfie')" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-indigo-600 file:text-white border border-slate-700 rounded-lg bg-slate-900">
                        <img id="previewSelfie" class="hidden mt-2 rounded-lg max-h-32 mx-auto border border-slate-700">
                    </div>
                </div>

                <!-- Checkbox & Anti-Bot -->
                <div class="space-y-2 pt-2 border-t border-slate-700">
                    <label class="flex items-start space-x-2 cursor-pointer">
                        <input type="checkbox" id="acceptContract" required class="mt-0.5 rounded bg-slate-900 border-slate-700 text-indigo-600">
                        <span class="text-xs text-slate-300">ยอมรับข้อตกลงและเงื่อนไขสัญญากู้ยืมเงิน</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer bg-slate-900 p-2.5 rounded-lg border border-slate-700">
                        <input type="checkbox" id="botCheck" required class="w-4 h-4 rounded bg-slate-800 border-slate-600 text-emerald-500">
                        <span class="text-xs text-slate-200">ฉันไม่ใช่โปรแกรมอัตโนมัติ</span>
                    </label>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-lg text-sm transition">
                    ส่งข้อมูลยื่นขอสินเชื่อ
                </button>
            </form>
        </section>

        <!-- 2. PAYMENT TAB -->
        <section id="tabPayment" class="hidden space-y-4">
            <div id="noLoanPayMsg" class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center text-slate-400">
                <i class="fa-solid fa-circle-info text-3xl text-slate-500 mb-2"></i>
                <p class="text-sm">คุณยังไม่มียอดที่ต้องชำระ หรืออยู่ในระหว่างรอการอนุมัติ</p>
            </div>

            <div id="payContainer" class="hidden bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4">
                <h3 class="text-sm font-bold text-slate-200 border-b border-slate-700 pb-2">ชำระเงินกู้</h3>
                <button onclick="openQrModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-lg text-sm transition">
                    <i class="fa-solid fa-qrcode mr-2"></i>แสดง QR Code และคัดลอกเบอร์ PromptPay
                </button>
            </div>
        </section>

        <!-- 3. LOG TAB (แสดงสัญญา) -->
        <section id="tabLog" class="hidden space-y-3">
            <h3 class="text-xs font-semibold text-slate-400">สัญญากู้ยืมเงินอิเล็กทรอนิกส์</h3>
            <div id="eContractContainer" class="bg-slate-800 border border-slate-700 rounded-xl p-4 text-xs space-y-2">
                <p class="text-center text-slate-500 py-4">ไม่พบข้อมูลสัญญา</p>
            </div>
        </section>

    </main>

    <!-- Modal Pop-up QR Code + คัดลอกเบอร์ + ดาวน์โหลด -->
    <div id="qrModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 w-full max-w-sm space-y-4 text-center">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h3 class="font-bold text-white text-sm"><i class="fa-solid fa-qrcode text-emerald-400 mr-2"></i>ชำระเงินผ่าน PromptPay</h3>
                <button onclick="closeQrModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="bg-white p-3 rounded-xl inline-block shadow-inner">
                <img id="modalQrImg" src="" alt="PromptPay QR" class="w-44 h-44 mx-auto">
            </div>

            <!-- ปุ่มดาวน์โหลด QR และ คัดลอกเบอร์ -->
            <div class="grid grid-cols-2 gap-2">
                <a id="downloadQrBtn" href="#" download="promptpay-qr.png" class="bg-slate-700 hover:bg-slate-600 text-white text-xs py-2 rounded-lg font-medium transition">
                    <i class="fa-solid fa-download mr-1"></i>ดาวน์โหลด QR
                </a>
                <button onclick="copyPromptPayNumber()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs py-2 rounded-lg font-medium transition">
                    <i class="fa-solid fa-copy mr-1"></i>ก๊อปปี้เบอร์โทร
                </button>
            </div>

            <!-- แนบสลิป -->
            <div class="text-left space-y-1.5 pt-2 border-t border-slate-700">
                <label class="block text-xs text-slate-400">แนบสลิปการโอนเงิน</label>
                <input type="file" id="fileSlip" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:bg-emerald-600 file:text-white border border-slate-700 rounded bg-slate-900">
            </div>

            <button onclick="alert('ส่งสลิปเรียบร้อยแล้ว รอแอดมินอนุมัติ'); closeQrModal();" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg text-sm transition">
                ยืนยันแจ้งชำระเงิน
            </button>
        </div>
    </div>

    <script>
        const PROMPTPAY_NUMBER = "0658351446";
        let deferredPrompt;

        document.addEventListener("DOMContentLoaded", () => {
            initDeviceId();
            checkLoanStatus();
            listenForBuzzerSignal(); // ฟังเสียงสัญญาณตามตัว
        });

        // PWA Installer
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwaInstallBtn').classList.remove('hidden');
        });

        function installPwaApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                document.getElementById('pwaInstallBtn').classList.add('hidden');
            }
        }

        function initDeviceId() {
            let uid = localStorage.getItem('device_uid');
            if (!uid) {
                uid = 'UID-' + Math.random().toString(36).substr(2, 8).toUpperCase();
                localStorage.setItem('device_uid', uid);
            }
            document.getElementById('displayUid').innerText = uid;
        }

        // ระบบ AI คัดกรองความเสี่ยงอัตโนมัติ (AI Screener)
        function aiRiskScreening(job, income, amount) {
            const riskyJobs = ['ว่างงาน', 'ตกงาน', 'ไม่มี', 'รับจ้างทั่วไป', 'หมุนเงิน'];
            const cleanJob = job.trim().toLowerCase();
            
            // ตรวจสอบคำคีย์เวิร์ดเสี่ยง
            const isRiskyJob = riskyJobs.some(keyword => cleanJob.includes(keyword));
            
            // ตรวจสอบความสอดคล้องของรายได้ (รายได้น้อยกว่า 3,000 หรือต่ำกว่า 3 เท่าของวงเงินกู้)
            const isLowIncome = parseFloat(income) < 3000 || parseFloat(income) < (parseFloat(amount) * 2);

            if (isRiskyJob || isLowIncome) {
                return { passed: false, reason: 'อาชีพหรือรายได้ไม่ผ่านเกณฑ์การประเมินความเสี่ยงขั้นต่ำของระบบ' };
            }
            return { passed: true };
        }

        // ยื่นขอสินเชื่อ
        function submitApplication() {
            const amount = document.getElementById('loanAmount').value;
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const job = document.getElementById('custJob').value;
            const income = document.getElementById('custIncome').value;

            // ให้ AI ทำการคัดกรองก่อน
            const aiResult = aiRiskScreening(job, income, amount);
            if (!aiResult.passed) {
                alert(`[ระบบ AI คัดกรองอัตโนมัติ]\nการยื่นขอสินเชื่อไม่ผ่านการอนุมัติ: ${aiResult.reason}`);
                
                // บันทึกสถานะปฏิเสธโดย AI
                const rejectedPayload = {
                    status: 'REJECTED',
                    reason: aiResult.reason,
                    timestamp: new Date().toLocaleString('th-TH')
                };
                localStorage.setItem('active_loan', JSON.stringify(rejectedPayload));
                checkLoanStatus();
                return;
            }

            // หากผ่าน AI บันทึกเป็นสถานะ "รอการตรวจสอบ" (PENDING) ให้แอดมินโทรเช็ก
            const payload = {
                uid: localStorage.getItem('device_uid'),
                amount: amount,
                name: name,
                phone: phone,
                job: job,
                income: income,
                address: document.getElementById('custAddress').value,
                work: document.getElementById('workAddress').value,
                paidAmount: 0,
                timestamp: new Date().toLocaleString('th-TH'),
                status: 'PENDING' // สถานะเริ่มต้นเป็น รอตรวจสอบ
            };

            localStorage.setItem('active_loan', JSON.stringify(payload));
            alert('ส่งข้อมูลเรียบร้อยแล้ว อยู่ระหว่างการตรวจสอบเอกสารและโทรยืนยันตัวตนจากเจ้าหน้าที่');
            checkLoanStatus();
        }

        // ตรวจสอบสถานะการอนุมัติ
        function checkLoanStatus() {
            const activeLoan = localStorage.getItem('active_loan');
            const banner = document.getElementById('statusBanner');
            const applyForm = document.getElementById('loanApplyForm');
            const activeLoanCard = document.getElementById('activeLoanCard');

            if (!activeLoan) {
                banner.classList.add('hidden');
                applyForm.classList.remove('hidden');
                return;
            }

            const loan = JSON.parse(activeLoan);

            if (loan.status === 'PENDING') {
                banner.className = "p-4 rounded-xl border bg-amber-500/10 border-amber-500/30 text-amber-300 text-xs space-y-1.5";
                banner.innerHTML = `
                    <div class="font-bold flex items-center text-amber-400 text-sm">
                        <i class="fa-solid fa-clock mr-2"></i>อยู่ระหว่างการตรวจสอบเอกสาร
                    </div>
                    <p class="text-slate-300">ระบบได้รับข้อมูลเรียบร้อยแล้ว เจ้าหน้าที่กำลังดำเนินการตรวจสอบข้อมูลและจะโทรติดต่อยืนยันตัวตนก่อนทำการอนุมัติ</p>
                `;
                banner.classList.remove('hidden');
                applyForm.classList.add('hidden');
                activeLoanCard.classList.add('hidden');

            } else if (loan.status === 'REJECTED') {
                banner.className = "p-4 rounded-xl border bg-rose-500/10 border-rose-500/30 text-rose-300 text-xs space-y-1.5";
                banner.innerHTML = `
                    <div class="font-bold flex items-center text-rose-400 text-sm">
                        <i class="fa-solid fa-circle-xmark mr-2"></i>ไม่ผ่านการอนุมัติสินเชื่อ
                    </div>
                    <p class="text-slate-300">สาเหตุ: ${loan.reason || 'ข้อมูลไม่ผ่านเกณฑ์การประเมินความเสี่ยง'}</p>
                `;
                banner.classList.remove('hidden');
                applyForm.classList.add('hidden');
                activeLoanCard.classList.add('hidden');

            } else if (loan.status === 'APPROVED') {
                banner.classList.add('hidden');
                applyForm.classList.add('hidden');
                activeLoanCard.classList.remove('hidden');

                // Render Dashboard
                const principal = parseFloat(loan.amount);
                const totalDebt = principal + (principal * 0.20);
                document.getElementById('dashTotalDebt').innerText = totalDebt.toLocaleString() + ' ฿';
                document.getElementById('noLoanPayMsg').classList.add('hidden');
                document.getElementById('payContainer').classList.remove('hidden');
            }
        }

        // ระบบส่งสัญญาณเสียงตามตัว (Audio Beep Alert)
        function triggerBuzzerSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                function playBeep(freq, duration, delay) {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'square'; // เสียง ตี๊ด สไตล์บิ๊ปเตือน
                        osc.frequency.value = freq;
                        gain.gain.value = 0.8;
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + duration);
                    }, delay);
                }

                // เล่นเสียง ตี๊ด! ตี๊ด! ตี๊ด! 3 ครั้งรวด
                playBeep(2500, 0.15, 0);
                playBeep(2500, 0.15, 250);
                playBeep(2500, 0.30, 500);

            } catch (e) {
                console.log("Audio not allowed yet");
            }
        }

        // จำลองฟังการส่งสัญญาณเสียงจากฝั่งแอดมิน
        function listenForBuzzerSignal() {
            window.addEventListener('storage', (e) => {
                if (e.key === 'trigger_sound_uid' && e.newValue === localStorage.getItem('device_uid')) {
                    triggerBuzzerSound();
                }
            });
        }

        // QR & PromptPay Actions
        function openQrModal() {
            const loan = JSON.parse(localStorage.getItem('active_loan') || '{}');
            const amount = loan.amount ? parseFloat(loan.amount) * 1.2 : 0;
            const qrUrl = `https://promptpay.io/${PROMPTPAY_NUMBER}/${amount}.png`;
            
            document.getElementById('modalQrImg').src = qrUrl;
            document.getElementById('downloadQrBtn').href = qrUrl;
            document.getElementById('qrModal').classList.remove('hidden');
        }

        function closeQrModal() { document.getElementById('qrModal').classList.add('hidden'); }

        function copyPromptPayNumber() {
            navigator.clipboard.writeText(PROMPTPAY_NUMBER);
            alert(`ก๊อปปี้เบอร์ PromptPay (${PROMPTPAY_NUMBER}) เรียบร้อยแล้ว`);
        }

        function switchTab(tab) {
            document.querySelectorAll('main > section').forEach(el => el.classList.add('hidden'));
            if (tab === 'apply') document.getElementById('tabApply').classList.remove('hidden');
            if (tab === 'payment') document.getElementById('tabPayment').classList.remove('hidden');
            if (tab === 'log') document.getElementById('tabLog').classList.remove('hidden');
        }

        function previewImage(input, previewId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.getElementById(previewId);
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
