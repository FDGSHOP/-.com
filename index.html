<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบไรเดอร์รับเงินสด</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* --- Loading Screen Styles --- */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner-container {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .loading-text {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-top: 15px;
        }

        /* Success Checkmark Animation */
        .success-checkmark {
            display: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #4CAF50;
            position: relative;
            animation: scaleIn 0.3s ease-in-out forwards;
        }

        .success-checkmark::after {
            content: '';
            position: absolute;
            left: 28px;
            top: 13px;
            width: 20px;
            height: 40px;
            border: solid white;
            border-width: 0 6px 6px 0;
            transform: rotate(45deg);
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- Camera Section Styles --- */
        .camera-box {
            position: relative;
            width: 100%;
            height: 300px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        video, canvas, #preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .btn-secondary {
            background-color: #ff9800;
        }

        .action-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-check { background-color: #4CAF50; flex: 1; font-size: 20px; }
        .btn-cross { background-color: #f44336; flex: 1; font-size: 20px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1. หน้าโหลด 0 ถึง 100% พร้อมอนิเมชั่นติ๊กถูก -->
    <div id="loading-overlay">
        <div class="spinner-container">
            <div id="loader-number" class="loading-text" style="position: absolute; width: 100%; text-align: center; top: 25px; font-size: 18px;">0%</div>
        </div>
        <div class="success-checkmark" id="success-icon"></div>
        <div class="loading-text" id="loading-label">กำลังโหลดระบบ...</div>
    </div>

    <!-- 2. ส่วนของระบบถ่ายรูปไรเดอร์ -->
    <div class="container">
        <h2>ยืนยันรับเงินสดรายวัน</h2>
        
        <div class="camera-box">
            <!-- จอแสดงผลจากกล้อง -->
            <video id="video" autoplay playsinline></video>
            <!-- รูปภาพตัวอย่างหลังจากกดถ่าย -->
            <img id="preview-img" class="hidden" alt="Preview">
            <!-- Canvas สำหรับแคปเจอร์ภาพ -->
            <canvas id="canvas" class="hidden"></canvas>
        </div>

        <!-- ปุ่มควบคุมกล้องปกติ -->
        <div id="camera-controls">
            <button class="btn btn-secondary" id="switch-camera-btn">🔄 สลับกล้องหน้า/หลัง</button>
            <button class="btn" id="capture-btn">📸 ถ่ายรูป</button>
        </div>

        <!-- ปุ่มยืนยัน (ติ๊กถูก / กากบาท) หลังจากถ่ายรูปแล้ว -->
        <div id="confirm-controls" class="action-buttons hidden">
            <button class="btn btn-cross" id="retake-btn" title="ถ่ายใหม่">❌</button>
            <button class="btn btn-check" id="send-btn" title="ยืนยันส่งข้อมูล">✔️</button>
        </div>
    </div>

    <script>
        // --- ส่วนที่ 1: จัดการหน้าโหลด (Loading & Success State) ---
        let currentProgress = 0;
        const numberEl = document.getElementById('loader-number');
        const labelEl = document.getElementById('loading-label');
        const successIcon = document.getElementById('success-icon');
        const loadingOverlay = document.getElementById('loading-overlay');

        const loadingInterval = setInterval(() => {
            currentProgress += Math.floor(Math.random() * 15) + 5; // สุ่มเพิ่มทีละ 5-20%
            if (currentProgress >= 100) {
                currentProgress = 100;
                clearInterval(loadingInterval);
                
                // เมื่อครบ 100% ให้เปลี่ยนเป็นเครื่องหมายถูก
                numberEl.style.display = 'none';
                labelEl.style.display = 'none';
                successIcon.style.display = 'block';

                // หน่วงเวลา 1.2 วินาที แล้วค่อยๆ เฟดหน้าโหลดหายไป
                setTimeout(() => {
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => {
                        loadingOverlay.style.display = 'none';
                    }, 500); // รอเวลาตรงกับ transition CSS 0.5s
                }, 1200);
            }
            numberEl.innerText = currentProgress + '%';
        }, 150);


        // --- ส่วนที่ 2: ระบบกล้องและการถ่ายรูป (Camera & Discord Send) ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const previewImg = document.getElementById('preview-img');
        const captureBtn = document.getElementById('capture-btn');
        const switchCameraBtn = document.getElementById('switch-camera-btn');
        const retakeBtn = document.getElementById('retake-btn');
        const sendBtn = document.getElementById('send-btn');
        const cameraControls = document.getElementById('camera-controls');
        const confirmControls = document.getElementById('confirm-controls');

        let useFrontCamera = false; // ค่าเริ่มต้นใช้กล้องหลัง (environment)
        let currentStream = null;
        let capturedBlob = null;

        // ฟังก์ชันเปิดกล้อง
        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : "environment"
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (error) {
                alert("ไม่สามารถเปิดกล้องได้: " + error.message);
            }
        }

        // สลับกล้องหน้า / กล้องหลัง
        switchCameraBtn.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        });

        // กดปุ่มถ่ายรูป
        captureBtn.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // แปลงภาพใน Canvas เป็น Blob เพื่อเตรียมส่ง
            canvas.toBlob((blob) => {
                capturedBlob = blob;
                const imageUrl = URL.createObjectURL(blob);
                previewImg.src = imageUrl;

                // สลับการแสดงผลจอ (ซ่อนวิดีโอ แสดงรูปพรีวิว)
                video.classList.add('hidden');
                previewImg.classList.remove('hidden');
                cameraControls.classList.add('hidden');
                confirmControls.classList.remove('hidden');

                // ปิดกล้องชั่วคราวเพื่อประหยัดแบตเตอรี่ตอนพรีวิว
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
            }, 'image/jpeg');
        });

        // กดยกเลิก / ถ่ายใหม่ (ปุ่มกากบาท ❌)
        retakeBtn.addEventListener('click', () => {
            previewImg.classList.add('hidden');
            video.classList.remove('hidden');
            confirmControls.classList.add('hidden');
            cameraControls.classList.remove('hidden');
            startCamera(); // เปิดกล้องใหม่อีกครั้ง
        });

        // กดยืนยันส่งข้อมูลเข้า Discord (ปุ่มติ๊กถูก ✔️)
        sendBtn.addEventListener('click', async () => {
            if (!capturedBlob) return;

            alert("กำลังส่งข้อมูลและรูปภาพไปยัง Discord...");

            // ตัวอย่างการเตรียมFormData ส่งเข้า Webhook Discord
            const formData = new FormData();
            formData.append('file', capturedBlob, 'rider_cash.jpg');
            formData.append('payload_json', JSON.stringify({
                content: "📦 แจ้งหลักฐานการรับเงินสดรายวันจากไรเดอร์"
            }));

            try {
                // ** แทนที่ URL ด้านล่างด้วย Discord Webhook URL ของคุณ **
                const webhookURL = 'YOUR_DISCORD_WEBHOOK_URL_HERE';
                
                // หากทดสอบระบบยังไม่ได้ใส่ Webhook จริง ให้คอมเมนต์บรรทัด fetch ด้านล่างไว้ก่อนได้ครับ
                /*
                const response = await fetch(webhookURL, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    alert("ส่งข้อมูลไปที่ Discord สำเร็จ!");
                    location.reload(); // รีโหลดหน้าเว็บกลับสู่ 0% ใหม่
                } else {
                    alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
                }
                */

                alert("จำลองการส่งสำเร็จ! (ให้นำ Discord Webhook URL ไปใส่ในโค้ดเพื่อใช้งานจริง)");
                location.reload();

            } catch (error) {
                alert("ไม่สามารถเชื่อมต่อกับ Discord ได้: " + error.message);
            }
        });

        // เริ่มต้นเปิดกล้องเมื่อโหลดหน้าเว็บเสร็จ
        startCamera();
    </script>
</body>
</html>
