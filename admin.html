<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบหลังบ้าน - การอนุมัติสินเชื่อและบริหารความเสี่ยง</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .dashboard-container { max-width: 1400px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; }
        .top-bar h2 { margin: 0; color: #38bdf8; font-size: 22px; }
        
        .controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        input, select { background: #1e293b; border: 1px solid #334155; color: white; padding: 8px 12px; border-radius: 6px; font-size: 14px; }
        
        .table-responsive { overflow-x: auto; background: #1e293b; border-radius: 8px; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th { background: #0f172a; padding: 12px; color: #94a3b8; border-bottom: 1px solid #334155; font-weight: 600; }
        td { padding: 12px; border-bottom: 1px solid #334155; vertical-align: middle; }
        tr:hover { background: #26334d; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-pending { background: #713f12; color: #fef08a; }
        .badge-approved { background: #14532d; color: #bbf7d0; }
        .badge-rejected { background: #7f1d1d; color: #fecaca; }
        
        .btn { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-approve { background: #22c55e; color: white; margin-right: 4px; }
        .btn-reject { background: #ef4444; color: white; }
        .doc-link { color: #38bdf8; text-decoration: none; }
        .doc-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="top-bar">
        <h2>ผู้ดูแลระบบอนุมัติสินเชื่อ (Loan Approval Portal)</h2>
        <span id="syncStatus" style="font-size: 12px; color: #94a3b8;">กำลังดึงข้อมูล...</span>
    </div>

    <!-- Filter Tools -->
    <div class="controls">
        <input type="text" id="searchInput" placeholder="ค้นหา UID / ชื่อ / เบอร์โทร..." onkeyup="filterData()" style="width: 250px;">
        <select id="statusFilter" onchange="filterData()">
            <option value="ALL">-- สถานะทั้งหมด --</option>
            <option value="pending">PENDING (รอพิจารณา)</option>
            <option value="approved">APPROVED (อนุมัติแล้ว)</option>
            <option value="rejected">REJECTED (ไม่อนุมัติ)</option>
        </select>
        <button class="btn" style="background:#3b82f6; color:white;" onclick="loadData()">🔄 Refresh ข้อมูลทันที</button>
    </div>

    <!-- Main Data Table -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>UID / เวลา</th>
                    <th>ข้อมูลผู้สมัคร (ชื่อ/เลขบัตร/โทร)</th>
                    <th>อาชีพ / รายได้</th>
                    <th>วัตถุประสงค์ / เอกสาร</th>
                    <th>ปรับวงเงินอนุมัติ (บาท)</th>
                    <th>ปรับวัน</th>
                    <th>สถานะ</th>
                    <th>ดำเนินการ</th>
                </tr>
            </thead>
            <tbody id="adminTableBody">
                <tr><td colspan="8" style="text-align:center;">กำลังโหลดข้อมูลคำขอทั้งหมด...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbze1aTsgVwkV6yLR0iRPN7hC7T4xc0z_MRCfs5MvJ0GCcQKno8_bx1EtTlo-QcdIgDE7Q/exec";
    let allData = [];

    async function loadData() {
        document.getElementById('syncStatus').innerText = "กำลังอัปเดตข้อมูลล่าสุด...";
        try {
            const res = await fetch(GAS_URL);
            allData = await res.json();
            filterData();
            document.getElementById('syncStatus').innerText = `อัปเดตล่าสุด: ${new Date().toLocaleTimeString()} (เช็กข้อมูลใหม่อัตโนมัติทุก 30s)`;
        } catch(e) {
            document.getElementById('syncStatus').innerText = "ดึงข้อมูลไม่สำเร็จ";
        }
    }

    function renderTable(dataList) {
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = '';

        if(!dataList || dataList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#94a3b8;">ไม่พบรายการคำขอสินเชื่อ</td></tr>';
            return;
        }

        dataList.forEach((item, index) => {
            const originalIndex = allData.findIndex(x => x.uid === item.uid);
            tbody.innerHTML += `
                <tr>
                    <td><b>${item.uid}</b><br><span style="font-size:10px; color:#94a3b8;">${item.timestamp || '-'}</span></td>
                    <td><b>${item.name}</b><br><span style="font-size:11px; color:#94a3b8;">ID: ${item.idCard || '-'}<br>Tel: ${item.phone || '-'}</span></td>
                    <td>${item.occupation || '-'}<br><b style="color:#38bdf8;">${Number(item.income || 0).toLocaleString()} บ./ด.</b></td>
                    <td>${item.purpose || '-'}<br>${item.docUrl ? `<a href="${item.docUrl}" target="_blank" class="doc-link">📂 เปิดเอกสารแนบ</a>` : '-'}</td>
                    <td><input type="number" id="amt-${originalIndex}" value="${item.amount}" style="width:100px;"></td>
                    <td>
                        <input type="number" id="days-${originalIndex}" value="${item.days}" style="width:60px;">
                        <button onclick="document.getElementById('days-${originalIndex}').value = 7">7d</button>
                        <button onclick="document.getElementById('days-${originalIndex}').value = 30">30d</button>
                    </td>
                    <td><span class="badge badge-${item.status}">${item.status.toUpperCase()}</span></td>
                    <td>
                        <button class="btn btn-approve" onclick="updateLoan(${originalIndex}, 'approved')">อนุมัติ</button>
                        <button class="btn btn-reject" onclick="updateLoan(${originalIndex}, 'rejected')">ปฏิเสธ</button>
                    </td>
                </tr>
            `;
        });
    }

    function filterData() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const status = document.getElementById('statusFilter').value;

        const filtered = allData.filter(item => {
            const matchSearch = (item.uid||'').toString().toLowerCase().includes(search) || 
                                (item.name||'').toLowerCase().includes(search) || 
                                (item.phone||'').toLowerCase().includes(search);
            const matchStatus = status === 'ALL' || item.status === status;
            return matchSearch && matchStatus;
        });

        renderTable(filtered);
    }

    async function updateLoan(index, newStatus) {
        const item = allData[index];
        const newAmount = Number(document.getElementById(`amt-${index}`).value);
        const newDays = Number(document.getElementById(`days-${index}`).value);

        try {
            await fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    action: "update",
                    uid: item.uid,
                    amount: newAmount,
                    days: newDays,
                    status: newStatus
                })
            });

            alert(`อัปเดตการพิจารณา UID: ${item.uid} เป็น [${newStatus.toUpperCase()}] เรียบร้อยแล้ว`);
            loadData();
        } catch(e) {
            alert("เกิดข้อผิดพลาดในการบันทึก");
        }
    }

    loadData();
    setInterval(loadData, 30000);
</script>
</body>
</html>
