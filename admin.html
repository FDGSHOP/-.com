<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการสินเชื่อ - ฝั่งแอดมิน</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light p-4">

<div class="container-fluid">
  <h3 class="mb-4">แผงควบคุมแอดมิน (Admin Dashboard)</h3>

  <div class="card p-3 shadow-sm mb-4">
    <h5>รายการขอกู้เงิน</h5>
    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle mt-2">
        <thead class="table-dark">
          <tr>
            <th>UID</th>
            <th>วัน-เวลา</th>
            <th>ชื่อ-นามสกุล</th>
            <th>เบอร์โทร</th>
            <th>ยอดกู้</th>
            <th>ยอดรวม</th>
            <th>เอกสาร</th>
            <th>สถานะ</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody id="tbodyLoans">
          <tr><td colspan="9" class="text-center">กำลังโหลดข้อมูล...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxvX1CSZpvq_58mPH4WYmtUzRYw2LXDGAx2aJyQLJuqzIIpeX3gabiQf0cdsU5DD-sNJw/exec";

  window.onload = function() {
    loadAdminData();
  };

  function loadAdminData() {
    fetch(`${WEB_APP_URL}?action=getAdminDashboard`)
      .then(res => res.json())
      .then(data => {
        renderLoans(data.loans);
      })
      .catch(err => console.error(err));
  }

  function renderLoans(loans) {
    const tbody = document.getElementById('tbodyLoans');
    tbody.innerHTML = '';

    if (!loans || loans.length <= 1) {
      tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted">ไม่มีรายการขอกู้</td></tr>';
      return;
    }

    for (let i = 1; i < loans.length; i++) {
      const row = loans[i];
      const uid = row[0];
      const time = new Date(row[1]).toLocaleString('th-TH');
      const name = row[2];
      const phone = row[4];
      const amt = row[5];
      const total = row[7];
      const file1 = row[13];
      const file2 = row[14];
      const status = row[16];

      let statusBadge = `<span class="badge bg-warning">${status}</span>`;
      if (status === 'APPROVED') statusBadge = `<span class="badge bg-success">อนุมัติแล้ว</span>`;
      if (status === 'REJECTED') statusBadge = `<span class="badge bg-danger">ปฏิเสธ</span>`;

      let actionBtns = '';
      if (status === 'PENDING') {
        actionBtns = `
          <button class="btn btn-sm btn-success me-1" onclick="approveLoan('${uid}')">อนุมัติ</button>
          <button class="btn btn-sm btn-danger" onclick="rejectLoan('${uid}')">ปฏิเสธ</button>
        `;
      }

      let docs = [];
      if (file1) docs.push(`<a href="${file1}" target="_blank">บัตร ปชช.</a>`);
      if (file2) docs.push(`<a href="${file2}" target="_blank">รูปคู่บัตร</a>`);

      tbody.innerHTML += `
        <tr>
          <td><strong>${uid}</strong></td>
          <td><small>${time}</small></td>
          <td>${name}</td>
          <td>${phone}</td>
          <td>${Number(amt).toLocaleString()}</td>
          <td>${Number(total).toLocaleString()}</td>
          <td>${docs.join(' | ') || '-'}</td>
          <td>${statusBadge}</td>
          <td>${actionBtns}</td>
        </tr>
      `;
    }
  }

  function approveLoan(uid) {
    Swal.fire({
      title: 'อนุมัติการกู้เงิน',
      text: `ต้องการอนุมัติรายการ ${uid} ใช่หรือไม่?`,
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: 'ยืนยันอนุมัติ',
      cancelButtonText: 'ยกเลิก'
    }).then((result) => {
      if (result.isConfirmed) {
        Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'approveLoan', uid: uid, proofBase64: '' })
        })
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success') {
            Swal.fire('สำเร็จ', 'อนุมัติรายการเรียบร้อย', 'success');
            loadAdminData();
          } else {
            Swal.fire('ผิดพลาด', data.message, 'error');
          }
        });
      }
    });
  }

  function rejectLoan(uid) {
    Swal.fire({
      title: 'ปฏิเสธการกู้เงิน',
      text: `ต้องการปฏิเสธรายการ ${uid} ใช่หรือไม่?`,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      confirmButtonText: 'ปฏิเสธ',
      cancelButtonText: 'ยกเลิก'
    }).then((result) => {
      if (result.isConfirmed) {
        Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'rejectLoan', uid: uid })
        })
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success') {
            Swal.fire('สำเร็จ', 'ปฏิเสธรายการเรียบร้อย', 'success');
            loadAdminData();
          } else {
            Swal.fire('ผิดพลาด', data.message, 'error');
          }
        });
      }
    });
  }
</script>
</body>
</html>
