<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - สินเชื่อคนพะเยา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { font-family: 'Prompt', sans-serif; }
        .pin-dot { transition: all 0.2s ease; }
        .pin-dot.active { background-color: #6366f1; border-color: #818cf8; transform: scale(1.1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- 🔒 1. หน้าจอใส่ PIN แบบแอปธนาคาร -->
    <div id="pinScreen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col justify-between items-center p-6">
        <div class="text-center mt-8 space-y-2">
            <div class="w-16 h-16 bg-indigo-950 border border-indigo-800 rounded-2xl flex items-center justify-center mx-auto text-indigo-400 text-2xl shadow-lg">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h1 class="text-lg font-bold text-white">ระบบจัดการแอดมิน</h1>
            <p class="text-xs text-slate-400">กรุณากรอกรหัส PIN 6 หลักเพื่อเข้าใช้งาน</p>
        </div>

        <!-- จุด PIN 6 จุด -->
        <div class="flex gap-4 my-auto">
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-700 bg-transparent"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-700 bg-transparent"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-700 bg-transparent"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-700 bg-transparent"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-700 bg-transparent"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-700 bg-transparent"></div>
        </div>

        <!-- แป้นพิมพ์ตัวเลข (Keypad) -->
        <div class="w-full max-w-xs grid grid-cols-3 gap-4 mb-8">
            <button onclick="pressPin('1')" class="h-16 rounded-full bg-slate-900 border border-slate-800 text-xl font-bold active:bg-indigo-600">1</button>
            <button onclick="pressPin('2')" class="h-16 rounded-full bg-slate-900 border border-slate-800 text-xl font-bold active:bg-indigo-600">2</button>
            <button onclick="pressPin('3')" class="h-16 rounded-full bg-slate-900 border border-slate-800 text-xl font-bold active:bg-indigo-600">3</button>
            <button onclick="pressPin('4')" class="h-16 rounded-full bg-slate-900 border border-slate-800 text-xl font-bold active:bg-indigo-600">4</button>
            <button onclick="pressPin('5')" class="h-16 rounded-full bg-slate-900 border border-slate-800 text-xl font-bold active:bg-indigo-600">5</button>
            <button onclick="pressPin('6')" class="h-16 rounded-full bg-slate-900 border border-slate-800 text-xl font-bold active:bg-indigo-600">6</button>
            <button onclick="pressPin('7')" class="h-16 rounded-full bg-slate-900 border border-slate-800 text-xl font-bold active:bg-indigo-600">7</button>
            <button onclick="pressPin('8')" class="h-16 rounded-full bg-slate-900 border border-slate-800 text-xl font-bold active:bg-indigo-600">8</button>
            <button onclick="pressPin('9')" class="h-16 rounded-full bg-slate-900 border border-slate-800 text-xl font-bold active:bg-indigo-600">9</button>
            <div></div>
            <button onclick="pressPin('0')" class="h-16 rounded-full bg-slate-900 border border-slate-800 text-xl font-bold active:bg-indigo-600">0</button>
            <button onclick="clearPin()" class="h-16 rounded-full bg-slate-900/50 border border-slate-800 text-sm font-bold text-rose-400 active:bg-rose-900 flex items-center justify-center">
                <i class="fa-solid fa-delete-left text-lg"></i>
            </button>
        </div>
    </div>

    <!-- 📱 2. หน้าหลัก Admin Dashboard -->
    <div id="adminApp" class="hidden p-4 max-w-lg mx-auto space-y-4 pb-20">
        
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <div>
                <h1 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-indigo-400"></i> Admin พะเยา
                </h1>
                <p class="text-[11px] text-slate-400">จัดการสัญญากู้ & รับชำระหนี้</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="loadAllData()" class="w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 flex items-center justify-center text-xs active:bg-slate-800">
                    <i class="fa-solid fa-rotate"></i>
                </button>
                <button onclick="lockSystem()" class="w-9 h-9 rounded-xl bg-rose-950 border border-rose-800 text-rose-400 flex items-center justify-center text-xs active:bg-rose-900">
                    <i class="fa-solid fa-lock"></i>
                </button>
            </div>
        </div>

        <!-- Dashboard สรุปยอดเงิน -->
        <div class="grid grid-cols-2 gap-2">
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl">
                <p class="text-[10px] text-slate-400 font-semibold uppercase">เงินทุนปล่อยกู้สะสม</p>
                <p id="sumInvested" class="text-base font-extrabold text-white my-0.5">0 ฿</p>
                <span id="sumActiveLoans" class="text-[10px] text-indigo-400">0 สัญญาแอคทีฟ</span>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl">
                <p class="text-[10px] text-slate-400 font-semibold uppercase">ยอดหนี้รอเก็บทั้งหมด</p>
                <p id="sumRemaining" class="text-base font-extrabold text-emerald-400 my-0.5">0 ฿</p>
                <span id="sumPendingLoans" class="text-[10px] text-amber-400">0 รายการรออนุมัติ</span>
            </div>
        </div>

        <!-- ปุ่มด่วนสแกนเก็บเงินสดหน้าร้าน -->
        <button onclick="scanCashQr()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold py-3 px-4 rounded-2xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-emerald-950">
            <i class="fa-solid fa-qrcode text-base"></i> สแกน QR / ใส่ UID ตัดยอดเงินสดหน้าร้าน
        </button>

        <!-- ตัวค้นหา + กรองสถานะ -->
        <div class="flex gap-2">
            <input type="text" id="searchInput" oninput="filterData()" placeholder="ค้นหาตาม UID หรือ เลขสัญญา..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
            <select id="filterStatus" onchange="filterData()" class="bg-slate-900 border border-slate-800 rounded-xl px-2 py-2 text-xs text-slate-300">
                <option value="all">ทั้งหมด</option>
                <option value="pending">รออนุมัติ</option>
                <option value="approved">อนุมัติอยู่</option>
                <option value="closed">ปิดสัญญาแล้ว</option>
            </select>
        </div>

        <!-- รายการสัญญาแบบ Cards (Mobile First) -->
        <div id="contractCardsContainer" class="space-y-3">
            <p class="text-slate-500 text-center py-6 text-xs">กำลังโหลดข้อมูลสัญญา...</p>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzE0C3oU0JA80hVfXHdefYB1-1lzTD5Vm5CYrWjmTZhuXre77plbvg7MQADfiteIjmDXw/exec";
        const CORRECT_PIN = "711455";
        let currentPin = "";
        let allContracts = [];

        function pressPin(num) {
            if (currentPin.length < 6) {
                currentPin += num;
                updatePinDots();
                if (currentPin.length === 6) {
                    setTimeout(checkPin, 150);
                }
            }
        }

        function clearPin() {
            currentPin = currentPin.slice(0, -1);
            updatePinDots();
        }

        function updatePinDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((dot, idx) => {
                if (idx < currentPin.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function checkPin() {
            if (currentPin === CORRECT_PIN) {
                document.getElementById('pinScreen').classList.add('hidden');
                document.getElementById('adminApp').classList.remove('hidden');
                loadAllData();
            } else {
                Swal.fire({ icon: 'error', title: 'PIN ไม่ถูกต้อง', text: 'กรุณาลองใหม่อีกครั้ง', timer: 1500, showConfirmButton: false });
                currentPin = "";
                updatePinDots();
            }
        }

        function lockSystem() {
            currentPin = "";
            updatePinDots();
            document.getElementById('adminApp').classList.add('hidden');
            document.getElementById('pinScreen').classList.remove('hidden');
        }

        async function loadAllData() {
            try {
                const res = await fetch(`${API_URL}?action=admin_fetch_all`);
                const response = await res.json();
                allContracts = response.data || [];

                if(response.summary) {
                    document.getElementById('sumInvested').innerText = Number(response.summary.total_invested).toLocaleString() + ' ฿';
                    document.getElementById('sumRemaining').innerText = Number(response.summary.total_remaining).toLocaleString() + ' ฿';
                    document.getElementById('sumActiveLoans').innerText = `${response.summary.active_loans} สัญญาแอคทีฟ`;
                    document.getElementById('sumPendingLoans').innerText = `${response.summary.pending_loans} รายการรออนุมัติ`;
                }

                renderContracts(allContracts);
            } catch (e) {
                console.error("Load Error:", e);
            }
        }

        function renderContracts(list) {
            const container = document.getElementById('contractCardsContainer');
            if (list.length === 0) {
                container.innerHTML = `<div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center text-slate-500 text-xs">ไม่พบสัญญากู้ในระบบ</div>`;
                return;
            }

            container.innerHTML = list.slice().reverse().map(item => `
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3 shadow-md">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[10px] font-mono text-indigo-400 font-bold bg-indigo-950/80 px-2 py-0.5 rounded border border-indigo-800">${item.uid}</span>
                            <p class="text-xs font-mono text-slate-400 mt-1">${item.contract_id}</p>
                        </div>
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${
                            item.status === 'approved' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' :
                            item.status === 'pending' ? 'bg-amber-950 text-amber-400 border border-amber-800' :
                            item.status === 'closed' ? 'bg-slate-800 text-slate-400' : 'bg-rose-950 text-rose-400'
                        }">${item.status.toUpperCase()}</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-xs bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80">
                        <div><span class="text-slate-500 text-[10px]">เงินต้น:</span> <p class="font-bold text-slate-200">${Number(item.principal).toLocaleString()} ฿</p></div>
                        <div><span class="text-slate-500 text-[10px]">ยอดรวมดอก:</span> <p class="font-bold text-slate-200">${Number(item.total_with_interest).toLocaleString()} ฿</p></div>
                        <div><span class="text-slate-500 text-[10px]">ค่างวดปกติ:</span> <p class="font-bold text-emerald-400">${Number(item.installment_amount).toLocaleString()} ฿</p></div>
                        <div><span class="text-slate-500 text-[10px]">ดอกลอย/งวด:</span> <p class="font-bold text-amber-400">${Number(item.floating_interest).toLocaleString()} ฿</p></div>
                    </div>

                    <div class="flex justify-between items-center text-xs pt-1">
                        <div>
                            <span class="text-[10px] text-slate-500">คงเหลือต้องเก็บ:</span>
                            <p class="text-base font-extrabold text-white">${Number(item.remaining_balance).toLocaleString()} ฿</p>
                        </div>

                        <div class="space-x-1">
                            ${item.status === 'pending' ? `
                                <button onclick="approveLoan('${item.uid}', 'approved')" class="bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-xl text-xs">อนุมัติ</button>
                                <button onclick="approveLoan('${item.uid}', 'rejected')" class="bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white font-bold px-3 py-1.5 rounded-xl text-xs">ปฏิเสธ</button>
                            ` : item.status === 'approved' ? `
                                <button onclick="adminPay('${item.uid}', 'full', ${item.installment_amount})" class="bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold px-2.5 py-1.5 rounded-xl text-[11px]">ตัดงวด</button>
                                <button onclick="adminPay('${item.uid}', 'interest_only', ${item.floating_interest})" class="bg-amber-600 hover:bg-amber-500 active:bg-amber-700 text-white font-bold px-2.5 py-1.5 rounded-xl text-[11px]">รับดอกลอย</button>
                            ` : `<span class="text-[10px] text-slate-500">เสร็จสิ้น</span>`}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterData() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('filterStatus').value;

            const filtered = allContracts.filter(c => {
                const matchSearch = c.uid.toLowerCase().includes(search) || c.contract_id.toLowerCase().includes(search);
                const matchStatus = status === 'all' || c.status === status;
                return matchSearch && matchStatus;
            });

            renderContracts(filtered);
        }

        async function approveLoan(uid, status) {
            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'admin_approve', uid: uid, status: status })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    Swal.fire({ icon: 'success', title: `ปรับสถานะเป็น ${status} เรียบร้อย` });
                    loadAllData();
                }
            } catch (e) { Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด' }); }
        }

        async function adminPay(uid, payType, amount) {
            Swal.fire({ title: 'กำลังบันทึกการชำระ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'payment',
                        uid: uid,
                        pay_type: payType,
                        pay_amount: amount,
                        method: 'cash'
                    })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ' });
                    loadAllData();
                }
            } catch (e) { Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด' }); }
        }

        function scanCashQr() {
            Swal.fire({
                title: 'รับเงินสดหน้าร้าน',
                input: 'text',
                inputPlaceholder: 'พิมพ์ UID ลูกค้า (เช่น PY-892102)',
                showCancelButton: true,
                confirmButtonText: 'ถัดไป',
                confirmButtonColor: '#10b981'
            }).then((res) => {
                if(res.isConfirmed && res.value) {
                    const uid = res.value.trim();
                    Swal.fire({
                        title: `รับเงินสดสำหรับ (${uid})`,
                        showDenyButton: true,
                        confirmButtonText: 'ตัดค่างวดปกติ (ต้น+ดอก)',
                        denyButtonText: 'รับเฉพาะดอกลอย',
                        confirmButtonColor: '#10b981',
                        denyButtonColor: '#f59e0b'
                    }).then(async (payRes) => {
                        if (payRes.isConfirmed) {
                            adminPay(uid, 'full', prompt('ระบุยอดเงินสดที่รับ:'));
                        } else if (payRes.isDenied) {
                            adminPay(uid, 'interest_only', prompt('ระบุยอดดอกลอยที่รับ:'));
                        }
                    });
                }
            });
        }
    </script>
</body>
</html>
