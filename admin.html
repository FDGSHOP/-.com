<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4 bg-light">

<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>🛠️ แอดมินมอนิเตอร์ & จัดการอนุมัติสินเชื่อ</h2>
    <button onclick="loadAdminData()" class="btn btn-primary">🔄 ดึงข้อมูลล่าสุด</button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <table class="table table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th>User ID</th>
            <th>ชื่อ-นามสกุล</th>
            <th>ยอดกู้ + ดอกเบี้ย</th>
            <th>รอบการชำระ</th>
            <th>ยอดจ่าย/งวด</th>
            <th>เอกสารแนบ</th>
            <th>สถานะปัจจุบัน</th>
            <th>การจัดการ (Action)</th>
          </tr>
        </thead>
        <tbody id="adminTableBody">
          <tr><td colspan="8" class="text-center">กำลังโหลดข้อมูล...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  window.onload = loadAdminData;

  function loadAdminData() {
    google.script.run.withSuccessHandler(renderTable).getAdminDashboard();
  }

  function renderTable(data) {
    const tbody = document.getElementById('adminTableBody');
    tbody.innerHTML = '';

    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center">ไม่พบรายการข้อมูล</td></tr>';
      return;
    }

    data.forEach(item => {
      let badgeClass = item.status === 'APPROVED' ? 'bg-success' : (item.status === 'PENDING' ? 'bg-warning text-dark' : 'bg-danger');
      
      let tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${item.userId}</strong></td>
        <td>${item.fullname}</td>
        <td>${item.amount} + ${item.interest} (${item.total})</td>
        <td>${item.payType}</td>
        <td>${item.dailyAmount}</td>
        <td><a href="${item.fileUrl}" target="_blank" class="btn btn-sm btn-outline-info">🖼️ เปิดไฟล์แนบ</a></td>
        <td><span class="badge ${badgeClass}">${item.status}</span></td>
        <td>
          ${item.status === 'PENDING' ? `
            <button onclick="changeStatus('${item.userId}', 'APPROVED')" class="btn btn-sm btn-success me-1">อนุมัติ</button>
            <button onclick="changeStatus('${item.userId}', 'REJECTED')" class="btn btn-sm btn-danger">ไม่อนุมัติ</button>
          ` : '<span class="text-muted">จัดการแล้ว</span>'}
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function changeStatus(userId, newStatus) {
    if (confirm(`ยืนยันการเปลี่ยนสถานะ ${userId} เป็น ${newStatus}?`)) {
      google.script.run.withSuccessHandler(res => {
        if (res.success) loadAdminData();
      }).updateStatus(userId, newStatus);
    }
  }
</script>
</body>
</html>
