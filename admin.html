<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แอดมิน - สินเชื่อออนไลน์สำหรับคนพะเยา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style> * { font-family: 'Prompt', sans-serif; } body { background-color: #0f172a; color: #f8fafc; } </style>
</head>
<body class="p-4 sm:p-6 min-h-screen">

    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-center pb-6 border-b border-slate-800 gap-4">
        <div>
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-indigo-500"></i> Admin Center - สินเชื่อคนพะเยา
            </h1>
            <p class="text-xs text-slate-400">ระบบคุม UID, ตรวจรับเงินสด และบันทึกดอกเบี้ยลอยรายวัน</p>
        </div>
        
        <!-- ปุ่มสแกน QR เงินสดหน้าร้าน -->
        <button onclick="openCashScanner()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-qrcode text-base"></i> สแกน QR รับเงินสดหน้าร้าน
        </button>
    </header>

    <!-- Dispatch Signal by UID -->
    <section class="my-4 bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col sm:flex-row items-center gap-3">
        <span class="text-xs text-slate-300 shrink-0 font-bold">ส่งสัญญาณตรงด้วย UID:</span>
        <input type="text" id="adminUidTarget" placeholder="กรอก UID ลูกค้า (เช่น PY-892102)..." class="bg-slate-950 px-3 py-2 rounded-xl text-xs text-white border border-slate-700 outline-none w-full font-mono">
        <button onclick="sendSignalByUid('REMIND')" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-3 py-2 rounded-xl shrink-0 font-semibold">ส่งสัญญาณเตือนชำระ</button>
        <button onclick="sendSignalByUid('APPROVE')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-xl shrink-0 font-semibold">ส่งสัญญาณอนุมัติ</button>
    </section>

    <!-- Table Daily Tasks -->
    <main class="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-list-check text-indigo-400"></i> รายการลูกค้านัดเก็บเงินประจำวัน
        </h3>
        
        <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-300">
                <thead class="bg-slate-950 text-slate-400">
                    <tr>
                        <th class="p-3">UID ลูกค้า</th>
                        <th class="p-3">วงเงินกู้</th>
                        <th class="p-3">ค่างวดปกติ</th>
                        <th class="p-3 text-amber-400">ดอกเบี้ยลอย/วัน</th>
                        <th class="p-3 text-center">จัดการการชำระเงิน</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                    <tr>
                        <td class="p-3 font-mono text-indigo-400 font-bold">PY-582910</td>
                        <td class="p-3 font-bold text-white">5,000 ฿</td>
                        <td class="p-3 font-bold text-emerald-400">857 ฿</td>
                        <td class="p-3 font-bold text-amber-400">143 ฿</td>
                        <td class="p-3 text-center space-x-1">
                            <button onclick="recordPayment('PY-582910', 'FULL')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded-lg text-[10px] font-bold">
                                Cut-Off (ตัดต้น+ดอก)
                            </button>
                            <button onclick="recordPayment('PY-582910', 'INTEREST_ONLY')" class="bg-amber-600 hover:bg-amber-500 text-white px-2.5 py-1.5 rounded-lg text-[10px] font-bold">
                                Pay Interest (ดอกลอย)
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // บันทึกการชำระเงินจากฝั่งแอดมิน
        function recordPayment(uid, payType) {
            if (payType === 'FULL') {
                Swal.fire({
                    icon: 'success',
                    title: `รับชำระค่างวดปกติ (${uid})`,
                    text: 'ระบบหักยอดเงินต้นและดอกเบี้ยตามสัญญาเรียบร้อยแล้ว',
                    confirmButtonColor: '#10b981'
                });
            } else if (payType === 'INTEREST_ONLY') {
                Swal.fire({
                    icon: 'warning',
                    title: `รับชำระเฉพาะดอกเบี้ย - ดอกลอย (${uid})`,
                    text: 'บันทึกการรับดอกเบี้ยประจำวันเรียบร้อยแล้ว (ยอดเงินต้นคงเหลือจะไม่ลดลง)',
                    confirmButtonColor: '#f59e0b'
                });
            }
        }

        // ส่งสัญญาณไปยังเครื่องลูกค้าด้วย UID
        function sendSignalByUid(type) {
            const uid = document.getElementById('adminUidTarget').value.trim();
            if(!uid) {
                Swal.fire({ icon: 'error', title: 'กรุณากรอก UID ลูกค้าก่อนส่งสัญญาณ' });
                return;
            }
            Swal.fire({
                icon: 'success',
                title: 'ส่งสัญญาณเรียบร้อย!',
                text: `สัญญาณประเภท ${type} ถูกยิงไปยังเครื่อง ${uid} แล้ว`,
                confirmButtonColor: '#4f46e5'
            });
        }

        // จำลองระบบสแกน QR Code เงินสด
        function openCashScanner() {
            Swal.fire({
                title: 'กล้องสแกน QR Code รับเงินสด',
                text: 'กำลังเปิดกล้องเพื่ออ่าน QR Code จากหน้าจอลูกค้า...',
                input: 'text',
                inputPlaceholder: 'หรือกรอกรหัส QR/UID เงินสดตรงนี้...',
                showCancelButton: true,
                confirmButtonText: 'ยืนยันตัดยอดเงินสด',
                confirmButtonColor: '#10b981'
            }).then((res) => {
                if(res.isConfirmed && res.value) {
                    Swal.fire({ icon: 'success', title: 'สแกนสำเร็จ!', text: `รับเงินสดและตัดยอดสำหรับ UID: ${res.value} เรียบร้อยแล้ว` });
                }
            });
        }
    </script>
</body>
</html>
