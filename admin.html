<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ระบบจัดการสินเชื่อ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>* { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- 🔒 หน้าใส่ PIN 6 หลัก (711455) -->
    <div id="pinScreen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col justify-between items-center p-6">
        <div class="text-center mt-8 space-y-2">
            <div class="w-16 h-16 bg-indigo-950 border border-indigo-800 rounded-2xl flex items-center justify-center mx-auto text-indigo-400 text-2xl shadow-lg"><i class="fa-solid fa-user-shield"></i></div>
            <h1 class="text-lg font-bold text-white">แอดมินสินเชื่อพะเยา</h1>
            <p class="text-xs text-slate-400">กรุณากรอกรหัส PIN 6 หลัก</p>
        </div>
        <div class="flex gap-4 my-auto">
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-700"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-700"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-700"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-700"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-700"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-700"></div>
        </div>
        <div class="w-full max-w-xs grid grid-cols-3 gap-4 mb-8">
            <button onclick="pressPin('1')" class="h-14 rounded-full bg-slate-900 text-xl font-bold">1</button>
            <button onclick="pressPin('2')" class="h-14 rounded-full bg-slate-900 text-xl font-bold">2</button>
            <button onclick="pressPin('3')" class="h-14 rounded-full bg-slate-900 text-xl font-bold">3</button>
            <button onclick="pressPin('4')" class="h-14 rounded-full bg-slate-900 text-xl font-bold">4</button>
            <button onclick="pressPin('5')" class="h-14 rounded-full bg-slate-900 text-xl font-bold">5</button>
            <button onclick="pressPin('6')" class="h-14 rounded-full bg-slate-900 text-xl font-bold">6</button>
            <button onclick="pressPin('7')" class="h-14 rounded-full bg-slate-900 text-xl font-bold">7</button>
            <button onclick="pressPin('8')" class="h-14 rounded-full bg-slate-900 text-xl font-bold">8</button>
            <button onclick="pressPin('9')" class="h-14 rounded-full bg-slate-900 text-xl font-bold">9</button>
            <div></div>
            <button onclick="pressPin('0')" class="h-14 rounded-full bg-slate-900 text-xl font-bold">0</button>
            <button onclick="clearPin()" class="h-14 rounded-full bg-slate-900/50 text-rose-400 flex items-center justify-center"><i class="fa-solid fa-delete-left text-lg"></i></button>
        </div>
    </div>

    <!-- 📱 Admin Panel -->
    <div id="adminApp" class="hidden p-4 max-w-lg mx-auto space-y-4 pb-20">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <h1 class="text-base font-bold text-white"><i class="fa-solid fa-shield-halved text-indigo-400"></i> แผงควบคุมพนักงาน</h1>
            <button onclick="loadAllData()" class="px-3 py-1 bg-slate-900 text-xs rounded-xl border border-slate-800"><i class="fa-solid fa-rotate"></i> รีเฟรช</button>
        </div>

        <!-- Dashboard การเงิน -->
        <div class="grid grid-cols-3 gap-2">
            <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-2xl text-center">
                <p class="text-[9px] text-slate-400">ปล่อยกู้สะสม</p>
                <p id="sumInvested" class="text-xs font-bold text-white my-0.5">0 ฿</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-2xl text-center">
                <p class="text-[9px] text-slate-400">ยอดรอเก็บทั้งหมด</p>
                <p id="sumRemaining" class="text-xs font-bold text-emerald-400 my-0.5">0 ฿</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-2xl text-center">
                <p class="text-[9px] text-slate-400">เป้าเก็บรายวัน</p>
                <p id="sumDailyExpected" class="text-xs font-bold text-amber-400 my-0.5">0 ฿</p>
            </div>
        </div>

        <!-- ปุ่มเปิดกล้องสแกน QR ลูกค้าหน้าร้าน -->
        <button onclick="openCameraScanner()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-2xl text-xs flex items-center justify-center gap-2 shadow-lg">
            <i class="fa-solid fa-camera text-base"></i> เปิดกล้องสแกน QR ลูกค้าเก็บเงินสด
        </button>

        <div id="reader" class="hidden rounded-2xl overflow-hidden border border-indigo-500"></div>

        <!-- รายการสัญญา -->
        <div id="contractCardsContainer" class="space-y-3"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbywT9IUKHLFBNgjSh59nhJUZMveCBs4YTXqimpsz2Xg0E18QMwZ7JMwY6sL6YFKur20og/exec";
        const CORRECT_PIN = "711455";
        let currentPin = "";
        let html5QrcodeScanner = null;

        function pressPin(n) {
            if(currentPin.length < 6) {
                currentPin += n;
                if(currentPin.length === 6) {
                    if(currentPin === CORRECT_PIN) {
                        document.getElementById('pinScreen').classList.add('hidden');
                        document.getElementById('adminApp').classList.remove('hidden');
                        loadAllData();
                    } else {
                        Swal.fire({ icon: 'error', title: 'PIN ไม่ถูกต้อง' });
                        currentPin = "";
                    }
                }
            }
        }
        function clearPin() { currentPin = currentPin.slice(0, -1); }

        async function loadAllData() {
            try {
                const res = await fetch(`${API_URL}?action=admin_fetch_all`);
                const response = await res.json();
                
                if(response.summary) {
                    document.getElementById('sumInvested').innerText = Number(response.summary.total_invested).toLocaleString() + ' ฿';
                    document.getElementById('sumRemaining').innerText = Number(response.summary.total_remaining).toLocaleString() + ' ฿';
                    document.getElementById('sumDailyExpected').innerText = Number(response.summary.daily_expected).toLocaleString() + ' ฿';
                }

                renderContracts(response.data || []);
            } catch (e) { console.error(e); }
        }

        function renderContracts(list) {
            const container = document.getElementById('contractCardsContainer');
            container.innerHTML = list.slice().reverse().map(item => `
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-2 text-xs">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-mono text-indigo-400 font-bold">${item.uid}</span>
                            <p class="font-bold text-white text-sm">${item.user_info.full_name || 'ลูกค้าทั่วไป'}</p>
                            <p class="text-[10px] text-slate-400">โทร: ${item.user_info.phone || '-'} | ธนาคาร: ${item.user_info.bank_name} (${item.user_info.bank_account})</p>
                            <p class="text-[10px] text-slate-400">ที่อยู่: ${item.user_info.address || '-'}</p>
                        </div>
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${item.status === 'approved' ? 'bg-emerald-950 text-emerald-400' : 'bg-amber-950 text-amber-400'}">${item.status}</span>
                    </div>

                    <div class="bg-slate-950 p-2 rounded-xl grid grid-cols-2 gap-1 text-[11px]">
                        <div>ขอกู้: <b class="text-white">${item.principal} ฿</b></div>
                        <div>ต้องเก็บรวม: <b class="text-emerald-400">${item.total_with_interest} ฿</b></div>
                        <div>ค่างวด: <b class="text-indigo-400">${item.installment_amount} ฿</b></div>
                        <div>ดอกลอย: <b class="text-amber-400">${item.floating_interest} ฿</b></div>
                    </div>

                    ${item.status === 'pending' ? `
                        <div class="pt-2 border-t border-slate-800 space-y-2">
                            <div class="grid grid-cols-2 gap-2">
                                <input type="number" id="adjAmt_${item.uid}" value="${item.principal}" placeholder="ปรับยอดอนุมัติ" class="bg-slate-950 border border-slate-800 p-1.5 rounded text-white">
                                <input type="number" id="adjPeriod_${item.uid}" value="${parseInt(item.pay_period)}" placeholder="ปรับจำนวนวัน" class="bg-slate-950 border border-slate-800 p-1.5 rounded text-white">
                            </div>
                            <div class="flex gap-2">
                                <button onclick="approveContract('${item.uid}', 'approved')" class="w-full bg-emerald-600 font-bold py-1.5 rounded-xl">อนุมัติคำขอ</button>
                                <button onclick="approveContract('${item.uid}', 'rejected')" class="w-full bg-rose-600 font-bold py-1.5 rounded-xl">ปฏิเสธ</button>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        async function approveContract(uid, status) {
            const adjAmt = document.getElementById(`adjAmt_${uid}`)?.value;
            const adjPeriod = document.getElementById(`adjPeriod_${uid}`)?.value;

            Swal.fire({ title: 'กำลังทำรายการ...', didOpen: () => Swal.showLoading() });
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'admin_approve', uid: uid, status: status, adjusted_amount: adjAmt, adjusted_period: adjPeriod })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    Swal.fire({ icon: 'success', title: 'บันทึกเรียบร้อย' });
                    loadAllData();
                }
            } catch(e) { Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด' }); }
        }

        function openCameraScanner() {
            document.getElementById('reader').classList.remove('hidden');
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render((decodedText) => {
                html5QrcodeScanner.clear();
                document.getElementById('reader').classList.add('hidden');
                processCashCollect(decodedText);
            });
        }

        function processCashCollect(uid) {
            Swal.fire({
                title: `เก็บเงินสดลูกค้า (${uid})`,
                input: 'number',
                inputLabel: 'ใส่ยอดเงินสดที่รับมาจริง:',
                showDenyButton: true,
                confirmButtonText: 'ตัดยอดค่างวดปกติ',
                denyButtonText: 'จ่ายเฉพาะดอกลอย',
                confirmButtonColor: '#10b981',
                denyButtonColor: '#f59e0b'
            }).then(async (res) => {
                if(res.isConfirmed || res.isDenied) {
                    const payType = res.isConfirmed ? 'full' : 'interest_only';
                    const amount = res.value;

                    const apiRes = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'payment', uid: uid, pay_type: payType, pay_amount: amount, method: 'CASH_STAFF' })
                    });
                    const data = await apiRes.json();

                    if(data.status === 'success') {
                        Swal.fire({
                            icon: 'success',
                            title: 'ชำระเงินสำเร็จ!',
                            text: `บันทึกตัดยอดเรียบร้อยแล้ว`,
                            confirmButtonColor: '#10b981'
                        });
                        loadAllData();
                    }
                }
            });
        }
    </script>
</body>
</html>
